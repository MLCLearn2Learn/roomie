<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2F8F6B"></head><body>
<title>Roomie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Roomie runs your classroom routines and transitions so you don't have to keep repeating yourself.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Chewy&family=Lilita+One&family=Patrick+Hand&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Roomie v0.2 · Look C "Bright bush". Projector-first: day strip on top, one big stage, tools along the bottom.
   Deliberately one bright classroom look (not themed light/dark): every colour is set explicitly. */
:root{
  --sky:#BFE8FA; --sky-calm:#CFE6F2; --dusk:#FCD9B8;
  --panel:#FFFFFF; --ink:#16302A; --muted:#4C6A61; --line:#D6E8DE;
  --gum:#2F8F6B; --gum-d:#1F6E52; --gum-l:#E3F4EA; --gum-m:#A9D9BC; --hill:#7CC79A;
  --wattle:#F5B700; --wattle-l:#FDEFD0; --wattle-ink:#4A3500;
  --coral:#F2785C; --coral-l:#FDE3DC; --coral-ink:#8A2E17;
  --display:'Baloo 2',ui-rounded,'Segoe UI',system-ui,sans-serif;
  --body:Nunito,ui-rounded,'Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body.fitted{overflow:hidden}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-weight:700;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;transition:background-color .6s}
body.calm{background:var(--sky-calm)} body.dusk{background:var(--dusk)}
*{box-sizing:border-box} [hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--wattle);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--display);font-weight:800}
.land{position:fixed;left:0;right:0;bottom:0;height:150px;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto auto 1fr auto;gap:14px;padding-block:16px}
/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.room{font-family:var(--display);font-size:clamp(20px,2vw,26px);font-weight:800;color:var(--gum-d)}
.date{font-size:16px;color:var(--muted)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.clock{font-family:var(--display);font-size:clamp(26px,2.6vw,36px);font-weight:800;font-variant-numeric:tabular-nums}
.ibtn{border:0;background:rgba(255,255,255,.85);border-radius:14px;width:44px;height:44px;display:grid;place-items:center;color:var(--ink)}
.demo{background:var(--wattle);color:var(--wattle-ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800}
/* day strip */
.strip{display:flex;gap:4px;min-width:0}
.seg{min-width:0;border-radius:12px;padding:7px 10px;font-size:14px;font-weight:800;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.past{background:var(--gum-m);color:#1F4A3C}
.seg.brk{background:var(--gum-l)}
.seg.now{background:var(--coral);color:#fff}
.seg.next{background:var(--wattle);color:#2A1E00}
/* check-in */
.fslot{display:block;font-family:var(--body);font-size:13px;font-weight:800;color:var(--gum-d);letter-spacing:.04em;text-transform:uppercase}
/* voice */
.micbtn.on{background:#E2558F!important;color:#fff;box-shadow:0 0 0 0 rgba(226,85,143,.5);animation:micp 2s infinite}
.micbtn.awake{background:#F5B700!important;color:#3B2A00;animation:micp .7s infinite}
@keyframes micp{0%{box-shadow:0 0 0 0 rgba(226,85,143,.45)}100%{box-shadow:0 0 0 14px rgba(226,85,143,0)}}
.vheard{position:fixed;left:50%;top:96px;transform:translate(-50%,-10px);z-index:75;background:#4A3F38;color:#FFF6E0;border-radius:999px;padding:9px 20px;font-family:var(--body);font-weight:700;font-size:18px;opacity:0;transition:all .25s;pointer-events:none;max-width:80vw;text-align:center}
.vheard.on{opacity:1;transform:translate(-50%,0)}
.vpriv{display:flex;flex-direction:column;gap:6px;background:#D4F2DF;border-radius:16px;padding:12px 16px}
.vpriv.warn{background:#FFE1CC}
.vpriv b{font-family:var(--display);font-size:20px}
.vpriv span{font-size:15px;line-height:1.4}
.vsug{position:fixed;left:50%;top:140px;transform:translateX(-50%);z-index:76;background:#FFFDF3;border:3px solid #F5B700;border-radius:20px;padding:12px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 28px rgba(60,40,20,.2);font-family:var(--body);max-width:90vw}
.vsug small{font-weight:700;font-size:15px}
.mirpill{display:inline-flex;align-items:center;gap:7px;border:0;cursor:pointer;background:#4A3F38;color:#FFF6E0;border-radius:999px;padding:7px 14px;font-family:var(--body);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;flex-shrink:0}
.mirpill i{width:10px;height:10px;border-radius:50%;background:#9A8F86}.mirpill i.t{background:#E2558F}.mirpill i.s{background:#2F8F6B}
.mstats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.mstats div{background:var(--panel);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column}
.mstats b{font-family:var(--display);font-size:clamp(28px,2.6vw,40px);line-height:1;color:var(--gum-d)}
.mstats span{font-size:14px;font-weight:700;opacity:.75}
.mtl{display:flex;height:44px;border-radius:10px;overflow:hidden;background:#EFE6D2;gap:1px}
.mtl i{flex:1;min-width:1px;background:linear-gradient(to top,#E2558F 0 calc(var(--t)*100%),#2F8F6B calc(var(--t)*100%) calc((var(--t) + var(--s))*100%),#E8DCC4 calc((var(--t) + var(--s))*100%))}
.mkey{display:flex;gap:16px;font-size:13px;font-weight:700}.mkey span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}.kt:before{background:#E2558F}.ks:before{background:#2F8F6B}.kq:before{background:#E8DCC4}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;min-height:0}
.mstep{background:#FFF1A8;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.mstep small,.mqs small{font-weight:800;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--gum-d)}
.mstep b{font-family:var(--display);font-size:26px}.mstep p{margin:0;font-size:16px;line-height:1.4}.mtry{font-weight:800}
.mstep textarea{font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:2px solid rgba(74,63,56,.2);background:#FFFDF6;width:100%;box-sizing:border-box}
.mqs{background:var(--panel);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;overflow:auto;max-height:340px}
.mq{display:grid;grid-template-columns:62px 1fr 44px;gap:8px;align-items:center;font-size:15px}.mq p{margin:0}.mq b{text-align:right}
.mq span{font-size:11px;font-weight:800;text-transform:uppercase;border-radius:6px;padding:2px 6px;text-align:center}.mq .o{background:#D4F2DF;color:#1F6B4E}.mq .c{background:#EFE6D2}
.cmics{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}.cmics .row{grid-column:1/-1}
.mhist{display:flex;flex-direction:column;gap:6px}.mhrow{display:flex;gap:6px;align-items:stretch}.mhrow .mh{flex:1;min-width:0}.mhdel{border:2px solid #F2C9D8;background:#fff;color:#B5306A;border-radius:12px;padding:6px 12px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}.mhdel.sure{background:#B5306A;color:#fff;border-color:#B5306A}.mh{display:flex;justify-content:space-between;gap:10px;border:0;background:var(--panel);border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer;text-align:left}.mh span{opacity:.75;font-size:14px}
.mirpill{padding:4px 5px 4px 12px!important;gap:6px!important}.mpm{display:inline-flex;align-items:center;gap:7px}.mpm i{width:10px;height:10px;border-radius:50%;background:#9A8F86}.mpm i.t{background:#E2558F}.mpm i.s{background:#2F8F6B}
.mpmark,.mpstop{cursor:pointer;border-radius:999px;padding:4px 10px;background:#FFF6E0;color:#4A3F38;font-size:13px}.mpmark.on{background:#F5B700}.mpstop{background:#E2558F;color:#fff}
.mtl i.inp{box-shadow:inset 0 -6px 0 #F5B700}
.greport{background:#FFFDF6;border:3px solid #F5B700;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.greport small,.gcur small,.gpick small,.gfb small{font-weight:800;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--gum-d)}
.greport h2{margin:0;font-family:var(--display);font-size:28px}
.gtiles{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:10px}@media(max-width:700px){.gtiles{grid-template-columns:repeat(2,minmax(0,1fr))}.gfb{grid-template-columns:1fr}}
.gt{background:var(--panel);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;border:2.5px solid transparent}.gt.ok{border-color:#2F8F6B}.gt.no{border-color:#F5B700}
.gt b{font-family:var(--display);font-size:32px;line-height:1}.gt span{font-size:14px;font-weight:700}.gt span i{font-style:normal;font-weight:600;opacity:.65}.gt small{font-size:12px;opacity:.75}
.gt em{font-style:normal;font-size:13px;font-weight:800}.gt em.up{color:#1F6B4E}.gt em.down{color:#B5306A}
.aiset{background:var(--panel);border-radius:14px;padding:10px 12px;display:grid;gap:4px}.aitog{display:flex;gap:10px;align-items:center;font-size:16px;cursor:pointer}.aitog input{width:22px;height:22px;accent-color:var(--gum,#E2558F)}.aitog em{font-style:normal;opacity:.65;font-weight:600}
.aibox{border:3px solid #8C6BE0;border-radius:18px;padding:12px 14px;display:grid;gap:8px;margin:12px 0;background:#FBF8FF}.aibox small{font-weight:800;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:#6A4BC4}.aiprev{background:#fff;border-radius:12px;padding:10px 12px;display:grid;gap:8px}.aipre{white-space:pre-wrap;font-size:12px;max-height:none;background:#F4EFE6;border-radius:8px;padding:8px;margin:6px 0 0}
.aimsg{background:#fff;border-radius:14px;padding:8px 12px;font-size:15px;line-height:1.45}.aimsg p{margin:4px 0}.aimsg.busy{opacity:.7;font-style:italic}.aime{justify-self:end;background:#E6DDFF;border-radius:14px;padding:8px 12px;font-size:15px;max-width:80%}.aierr{margin:0;color:#B5306A;font-weight:700}.aiold summary{cursor:pointer;font-weight:700;font-size:14px}
.mgoalfoot{display:grid;gap:10px;margin:12px 0}.mgoalfoot .mqs{max-height:none}.mgoalfoot textarea{height:64px;min-height:0}
.gfb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.gfb>div{border-radius:14px;padding:10px 12px}.gfb .w{background:#D4F2DF}.gfb .s{background:#FFD9CC}.gfb .t{background:#FFF1A8}.gfb .r{background:#E6DDFF}.gfb p{margin:2px 0 0;font-size:15px;line-height:1.4}.gfb .r p{font-size:14px}
.gself{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;font-size:15px}.gself-r{display:flex;gap:6px;align-items:center}.gself-r b{margin-right:4px}.gself-r button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line,#E8DCC8);background:#fff;font:inherit;font-weight:800;cursor:pointer}.gself-r button.on{background:var(--gum,#E2558F);color:#fff;border-color:transparent}
.grefs summary{cursor:pointer;font-weight:800;font-size:14px}.grefs ol{margin:4px 0 0;padding-left:20px;font-size:13px;line-height:1.45}.grefs p{margin:4px 0}.gmoved{margin:0;font-size:15px;background:#D4F2DF;border-radius:12px;padding:8px 12px}.gchart circle.me{fill:#8C6BE0}
.mall summary{cursor:pointer;font-weight:800;font-size:14px}.mall[open]{display:flex;flex-direction:column;gap:8px}
.gcur,.gpick{background:#FFF1A8;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.gopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.gopt{border:2.5px solid transparent;background:#FFFDF6;border-radius:14px;padding:10px 12px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}.gopt:hover{border-color:#E2558F}.gopt b{font-family:var(--display);font-size:19px}.gopt span{font-size:14px}
.gcharts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.gchart{background:var(--panel);border-radius:16px;padding:10px 12px}.gchart b{font-size:15px}.gchart b i{font-style:normal;opacity:.6;font-weight:600}
.gchart svg{width:100%;height:auto;display:block}.gchart .ln{fill:none;stroke:#E2558F;stroke-width:3}.gchart .tgt{stroke:#2F8F6B;stroke-dasharray:6 5;stroke-width:2}.gchart .tgtl{fill:#2F8F6B;font-size:13px;font-weight:700}
.gchart circle.ok{fill:#2F8F6B}.gchart circle.no{fill:#F5B700}.gchart .vl{font-size:14px;font-weight:800;fill:#4A3F38}.gchart .xl{font-size:12px;fill:#7A6E64}
.gatt{display:flex;flex-direction:column;gap:6px}.linkbtn{border:0;background:none;font:inherit;text-decoration:underline;cursor:pointer;padding:0;color:inherit}

.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.vrow{background:var(--panel);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.vrow b{font-family:var(--display);font-size:20px;color:var(--gum-d)}
.vrow span{font-size:15px;line-height:1.35}
/* student devices */
.livebtn{display:inline-flex;align-items:center;gap:7px;border:0;cursor:pointer;font-family:var(--display);font-weight:800;font-size:17px;color:#4A3F38;background:#fff;border-radius:999px;padding:7px 14px;box-shadow:0 2px 0 rgba(120,90,60,.15)}
.livebtn.on{background:#2F8F6B;color:#fff}
.livebtn.on:before{content:"";width:9px;height:9px;border-radius:50%;background:#B8F5D2;box-shadow:0 0 0 3px rgba(184,245,210,.35);animation:glow 2s infinite}
/* home button */
.homebtn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font-family:var(--display);font-weight:800;font-size:20px;color:#4A3F38;background:#FFF1A8;border-radius:999px;padding:8px 18px 8px 14px;box-shadow:0 3px 0 rgba(120,90,60,.18);margin-right:6px}
.homebtn:hover{transform:translateY(-1px)}
body.at-home .homebtn{opacity:.55}
/* class menu in the header */
.classbtn{display:inline-flex;align-items:center;gap:10px;border:0;background:transparent;padding:4px 14px 4px 6px;border-radius:16px;cursor:pointer;color:inherit;font:inherit}
.classbtn[aria-expanded="true"] .cbsub{outline:3px solid rgba(255,255,255,.9)}
.cbsub{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:21px;font-weight:800;color:#fff;background:var(--acc,var(--gum,#E2558F));border-radius:999px;padding:7px 18px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.cbsub #classCount{font-size:15px;opacity:.85}
.classbtn:hover .cbsub{transform:translateY(-1px)}
.cbcaret{font-size:14px;color:var(--gum-d)}
.classpop{position:fixed;z-index:72;background:var(--panel,#FFFDF3);border:3px solid var(--gum,#E2558F);border-radius:22px;padding:14px;box-shadow:0 16px 36px rgba(60,40,20,.25);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(560px,92vw);animation:pop .25s cubic-bezier(.2,1.6,.4,1)}
.cprename{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cprename label{font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--gum-d)}
.cprename input{flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:22px;padding:8px 12px;border-radius:12px;border:2.5px solid var(--line);background:#fff;color:var(--ink)}
.classpop h3{grid-column:1/-1;margin:0 0 2px;font-size:18px}
.classpop .tile{min-height:84px}
/* compact day plan */
.psum{display:grid;grid-template-columns:150px minmax(0,180px) minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:#fff;border-radius:12px;padding:9px 14px;font:inherit;color:var(--ink);cursor:pointer;box-shadow:0 1px 0 rgba(120,90,60,.1)}
.psum:hover{background:var(--gum-l,#FFF6C9)}
.psum .pt{font-weight:800;font-size:14px;color:var(--muted)}
.psum b{font-size:18px;font-family:var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psum .px{font-size:13.5px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psum .pe{font-size:13px;font-weight:800;color:var(--gum-d);border:2px solid currentColor;border-radius:999px;padding:2px 10px}
.psum.k-break{background:#FFF8D6}
.plan{gap:5px!important}
.pedit{display:flex;flex-direction:column;gap:6px;background:#fff;border:3px solid var(--gum,#E2558F);border-radius:16px;padding:8px}
.pedit .prow{padding:0}
/* tap a subject */
.seg[data-seg]{cursor:pointer;transition:transform .12s}
.seg[data-seg]:hover{transform:translateX(3px)}
.segpop{position:fixed;z-index:70;background:var(--panel,#FFFDF3);border:3px solid var(--gum,#E2558F);border-radius:20px;padding:14px 16px;width:300px;box-shadow:0 14px 34px rgba(60,40,20,.25);display:flex;flex-direction:column;gap:8px;animation:pop .25s cubic-bezier(.2,1.6,.4,1);font-family:var(--body)}
.segpop small{font-weight:800;font-size:13px;color:var(--gum-d)}
.segpop b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05}
.segpop ul{margin:0;padding-left:1.1em;font-size:15px;font-weight:700;display:flex;flex-direction:column;gap:2px}
.segpop .row{gap:6px}
/* toolkit home */
body.mode-tools .strip{display:none}
body.mode-tools .dtools{visibility:hidden}
body.mode-tools .tiles{grid-template-columns:repeat(5,minmax(0,1fr))}
body.mode-tools .tile{min-height:88px;padding:14px 16px}
body.mode-tools .app,body.mode-tools.tl-side .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:6px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:0;border-radius:20px;padding:16px 18px;font:inherit;color:var(--ink);cursor:pointer;background:var(--gum-l);min-height:96px;box-shadow:0 3px 0 rgba(120,90,60,.14);transition:transform .15s}
.tile:hover{transform:translateY(-2px) rotate(-.6deg)}
.tile b{font-family:var(--display);font-weight:800;font-size:clamp(20px,1.8vw,26px);line-height:1.1}
.tile span{font-size:14px;opacity:.8;font-weight:600}
.tile:nth-child(6n+1){background:#FFD9E8}.tile:nth-child(6n+2){background:#FFF1A8}.tile:nth-child(6n+3){background:#D4F2DF}.tile:nth-child(6n+4){background:#D8E8FF}.tile:nth-child(6n+5){background:#E6DDFF}.tile:nth-child(6n+6){background:#FFE1CC}
.mdesc{display:block;font-size:13px;font-weight:600;opacity:.85;margin-top:2px}
[data-mode].btn{flex-direction:column;align-items:flex-start;text-align:left;height:auto;padding-block:10px}
/* day as a side column */
body.tl-side .app{grid-template-columns:minmax(170px,210px) minmax(0,1fr);grid-template-rows:auto 1fr auto;column-gap:18px}
body.tl-side .top,body.tl-side .dock{grid-column:1 / -1}
body.tl-side .strip{flex-direction:column;gap:5px;min-height:0;overflow:hidden}
body.tl-side .seg{display:flex;flex-direction:column;justify-content:center;gap:1px;white-space:normal;flex:none;padding:5px 12px;overflow:visible}
body.tl-side .seg small{font-family:var(--body);font-size:12px;font-weight:800;opacity:.75;letter-spacing:.02em}
body.tl-side .seg b{font-weight:inherit;font-size:19px;line-height:1.1;overflow:hidden;text-overflow:ellipsis}
body.tl-side .seg em{font-style:normal;font-family:var(--body);font-size:11.5px;font-weight:700;opacity:.8;line-height:1.2}
body.tl-side .seg.now{padding-block:12px;transform:rotate(-1deg);box-shadow:0 6px 14px rgba(120,60,60,.18)}
body.tl-side .seg.past{padding-block:3px}
body.tl-side .seg.past small{display:none}
body.tl-side .seg.past b{font-size:15px}
.tlh{margin:0 0 2px;font-family:var(--display);font-size:22px;color:var(--gum-d)}
body.tl-hide .strip{display:none}
body.tl-hide .app{grid-template-rows:auto 1fr auto}
/* stage */
.stage{min-height:0;display:grid;gap:22px;grid-template-columns:minmax(0,1fr) minmax(300px,400px)}
.stage.one{grid-template-columns:minmax(0,1fr)}
.stage.two{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.card{background:var(--panel);border-radius:36px;padding:clamp(20px,2.4vw,34px);min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px}
.card.sm{border-radius:28px;padding:18px 20px}
.side{display:flex;flex-direction:column;gap:16px;min-height:0}
.eyebrow{font-size:15px;font-weight:800;color:var(--gum);letter-spacing:.08em;text-transform:uppercase}
.big{font-size:clamp(44px,5.6vw,88px);line-height:.95;color:var(--gum-d)}
.mid{font-size:clamp(30px,3.4vw,52px);line-height:1}
.lead{font-size:clamp(17px,1.5vw,21px);color:var(--muted);margin:0}
.hint{font-size:14px;color:var(--muted);font-weight:700}
/* steps */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;align-items:center;gap:16px;font-size:clamp(20px,2vw,27px);font-weight:800;padding:6px 4px;border-radius:24px}
.steps li .n{flex:none;width:46px;height:46px;border-radius:999px;background:var(--gum-l);color:var(--gum-d);display:grid;place-items:center;font-family:var(--display);font-size:22px}
.steps li.done{color:#7E918A} .steps li.done .t{text-decoration:line-through}
.steps li.done .n{background:var(--hill);color:#fff}
.steps li.cur{background:var(--wattle);color:#2A1E00;font-family:var(--display);font-size:clamp(28px,3.1vw,44px);padding:12px 20px}
.steps li.cur .n{width:58px;height:58px;background:#fff;color:var(--gum-d)}
.steps.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.steps.grid2 li{background:var(--gum-l);padding:14px 16px}
/* timer ring */
.ring{position:relative;width:100%;max-width:280px;aspect-ratio:1;margin-inline:auto}
.ring svg{width:100%;height:100%;display:block}
.ring .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rt b{font-family:var(--display);font-size:clamp(46px,5vw,76px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.ring .rt span{font-size:15px;color:var(--muted)}
.ring.md .rt b{font-size:46px}.ring.sm .rt b{font-size:30px}.ring.sm .rt span{font-size:12px}
.steps.grid2 li.cur{font-size:clamp(24px,2.4vw,34px)}
.warn .steps li .n svg{stroke:#fff}
/* expectations */
.exp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.exp div{background:var(--gum-l);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px;font-size:clamp(17px,1.5vw,20px);font-weight:800}
.exp i{width:44px;height:44px;border-radius:14px;background:var(--gum);display:grid;place-items:center;font-style:normal;color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--gum-l);color:var(--gum-d);border-radius:999px;padding:7px 14px;font-size:17px;font-weight:800}
/* misc */
.task{background:var(--wattle-l);border-radius:24px;padding:18px 22px;font-family:var(--display);font-size:clamp(26px,2.8vw,40px);font-weight:800;color:var(--wattle-ink)}
.np{display:flex;align-items:center;gap:12px;background:#fff;border-radius:26px;padding:14px 18px}
.np .ic{width:46px;height:46px;border-radius:999px;background:var(--coral);display:grid;place-items:center;flex:none}
.eq{display:flex;gap:4px;align-items:flex-end;height:26px;margin-left:auto}
.eq i{width:5px;height:8px;background:var(--gum);border-radius:3px}
.playing .eq i{animation:eq 1s ease-in-out infinite}.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{50%{height:26px}}
.meter{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.meter i{height:18px;border-radius:6px;background:var(--gum-l)} .meter i.g{background:var(--gum)} .meter i.y{background:var(--wattle)} .meter i.r{background:var(--coral)}
.goalbar{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px}
.goalbar i{height:14px;border-radius:999px;background:var(--gum-l)} .goalbar i.on{background:var(--wattle)}
.btn{border:0;border-radius:999px;padding:12px 22px;font-family:var(--display);font-size:19px;font-weight:700;background:var(--gum-d);color:#fff;min-height:48px}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--gum-m)}
.btn.coral{background:var(--coral)} .btn.gold{background:var(--wattle);color:#2A1E00}
.btn.sm{padding:8px 16px;font-size:16px;min-height:40px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.warnbox{background:var(--coral-l);color:var(--coral-ink);border-radius:16px;padding:12px 16px;font-size:15px}
.okbox{background:var(--gum-l);color:var(--gum-d);border-radius:16px;padding:12px 16px;font-size:15px}
/* warning */
.warn{background:var(--wattle);color:#2A1E00}
.warn .steps li{background:rgba(255,255,255,.72);padding:12px 18px;font-size:clamp(22px,2.2vw,30px)}
.warn .steps li .n{background:var(--ink);color:#fff}
/* door */
.door{background:var(--gum-d);color:#fff}
.door .big{color:#fff;font-size:clamp(60px,7vw,104px)}
.door .task{background:rgba(255,255,255,.14);color:#fff}
.door .chip{background:var(--wattle);color:#2A1E00}
/* breathing */
.breathe{width:min(100%,360px);aspect-ratio:1;margin-inline:auto;border-radius:50%;background:var(--gum-l);display:grid;place-items:center;position:relative}
.breathe i{position:absolute;inset:12%;border-radius:50%;background:var(--gum-m)}
.breathe em{position:absolute;inset:24%;border-radius:50%;background:var(--gum);transform:scale(.55);transition:transform 4s ease-in-out}
.breathe b{position:relative;color:#fff;font-family:var(--display);font-size:clamp(26px,2.6vw,40px);text-align:center;padding:0 8px;text-shadow:0 1px 2px rgba(0,0,0,.2)}
/* weather */
.wx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wx button{border:0;border-radius:20px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:17px;font-weight:800}
/* picker/groups */
.pick{font-family:var(--display);font-size:clamp(70px,11vw,160px);font-weight:800;text-align:center;line-height:1;color:var(--gum-d);padding:20px 0}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.group{border-radius:22px;padding:14px 16px;background:var(--gum-l)} .group b{display:block;color:var(--gum);font-size:15px;margin-bottom:4px} .group div{font-size:22px}
.call{font-family:var(--display);font-size:clamp(34px,4.4vw,62px);font-weight:800;line-height:1.05;padding:20px 24px;border-radius:26px;background:var(--wattle-l);color:var(--wattle-ink)}
.call.freeze{background:var(--coral);color:#fff}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.rbtn{border:2px solid var(--line);background:#fff;border-radius:24px;padding:16px 18px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
.rbtn b{font-family:var(--display);font-size:24px;line-height:1.05}.rbtn span{font-size:14px;color:var(--muted)} .rbtn:hover{border-color:var(--gum)}
/* dock */
.dock{display:flex;gap:14px;align-items:center}
.dtools{display:flex;flex-wrap:wrap;gap:8px 7px;flex:1;min-width:0}
.dbreak{flex-basis:100%;height:0}
.dacts{display:flex;gap:8px;flex:none;align-items:center}
.dacts .tool.att{margin-left:0}
.tool{border:0;background:rgba(255,255,255,.92);border-radius:999px;padding:8px 14px;font-family:var(--display);font-size:16px;font-weight:700;min-height:44px;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.tool.on{background:var(--gum-d);color:#fff}
.tool.att{background:var(--coral);color:#fff;margin-left:auto}
.ver{font-size:12px;color:var(--ink);opacity:.75;background:rgba(255,255,255,.7);border-radius:8px;padding:2px 8px}
/* overlays */
.attn{position:fixed;inset:0;z-index:50;background:var(--coral);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
.attn b{font-family:var(--display);font-size:clamp(60px,10vw,140px);line-height:1}
.attn p{font-size:clamp(20px,2.4vw,32px);margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:16px;z-index:60;max-width:calc(100% - 32px)}
.ytcard{position:fixed;right:max(24px,env(safe-area-inset-right,0px));bottom:88px;width:320px;z-index:20;background:#fff;border-radius:20px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.ytcard iframe{display:block;width:100%;height:200px;border:0;border-radius:12px;background:#000}
.splash{position:fixed;inset:0;z-index:70;background:var(--sky);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.splash .box{max-width:640px;display:flex;flex-direction:column;gap:16px}
/* setup sheet */
.sheet{position:fixed;inset:0;z-index:40;background:#F3FAF6;overflow:auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;background:#fff;border-radius:999px;padding:9px 16px;font-weight:800}
.tab[aria-selected="true"]{background:var(--gum-d);color:#fff}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label,.lbl{font-weight:800;font-size:15px}
input[type=text],input[type=url],input[type=number],input[type=time],select,textarea{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;font-size:16px;font-weight:700;width:100%}
textarea{min-height:140px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px}
.list{display:flex;flex-direction:column;gap:6px}
.list button{border:0;background:#fff;border-radius:12px;padding:11px 14px;text-align:left;font-weight:800}
.list button[aria-current="true"]{background:var(--gum-d);color:#fff}
.chk{display:flex;gap:10px;align-items:flex-start}
.chk input{width:22px;height:22px;margin-top:2px;flex:none}
.plan{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:minmax(112px,124px) minmax(112px,124px) minmax(0,1.3fr) minmax(0,.8fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 42px 42px 42px 34px;gap:6px;align-items:center;background:#fff;border-radius:14px;padding:8px}
.pextra{grid-column:3 / span 5;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:var(--gum-l,#f4f1e6);border-radius:10px;padding:8px}
.pextra label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;min-width:0}
.pextra select{width:100%;min-width:0;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.pextra .pair{display:grid;grid-template-columns:140px minmax(0,1fr);gap:4px;text-transform:none}
.prow.h{background:transparent;font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;padding:0 8px}
.prow input,.prow select{padding:7px 8px;font-size:14px}
.tablewrap{overflow:visible}
.prow.h{font-size:11px!important;letter-spacing:.02em!important}
.relief{background:#fff;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:14px;color:#1d2b27}
.relief h2{font-size:30px;color:var(--gum-d)} .relief h3{font-size:22px;margin-top:6px}
.relief table{border-collapse:collapse;width:100%} .relief td{border-bottom:1px solid var(--line);padding:6px 8px;font-weight:700;vertical-align:top}
@media (max-width:599px){
  body.tl-side .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto} body.tl-side .strip{flex-direction:row;overflow:hidden} body.tl-side .seg small,body.tl-side .seg em,.tlh{display:none} body.tl-side .seg{min-height:0}
  .stage,.stage.two{grid-template-columns:1fr}
  .exp{grid-template-columns:repeat(2,minmax(0,1fr))}
  .app{height:auto;min-height:100%}
  .two{grid-template-columns:1fr}
  .steps.grid2{grid-template-columns:1fr}
  .ytcard{position:static;width:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- Fun layer (v0.3) ---------- */
.sky{position:fixed;left:0;right:0;top:0;height:300px;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;left:0;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(calc(100vw + 300px))}}
.flyby{position:absolute;top:60px;left:-90px;width:54px;height:40px;animation:fly 11s linear forwards}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(28vw,-22px)}50%{transform:translate(56vw,10px)}75%{transform:translate(84vw,-16px)}100%{transform:translate(calc(100vw + 140px),0)}}
.flyby .w{transform-origin:24px 20px;animation:flap .22s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(-.7)}}
.bunting{position:fixed;left:0;right:0;top:0;height:40px;width:100%;pointer-events:none;z-index:0}
body.fun-calm .sky{display:none}
body.t-beach .land path:first-child{fill:#47B3D6} body.t-beach .land path:last-child{fill:#F1D49B}
/* mascot */
.mascot{position:relative;width:66px;height:66px;margin:-14px 0 -12px;flex:none;pointer-events:none}
.mascot svg{width:100%;height:100%;overflow:visible;display:block}
.mascot .bodyg,.bigbird .bodyg,.runner .bodyg{transform-origin:50px 90px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.mascot .wing,.bigbird .wing,.runner .wing{transform-origin:30px 56px}
.ring svg circle:first-child{stroke:var(--gum-l)}
.mascot .lid,.bigbird .lid,.runner .lid,.journey .lid{transform-origin:63px 29.4px;transform:scaleY(0);animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
.notes,.zz{opacity:0}
.mascot.sing .notes{opacity:1}
.mascot.sing .notes path{animation:note 1.6s ease-out infinite}
.mascot.sing .notes path:nth-child(2){animation-delay:.8s}
@keyframes note{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(10px,-26px);opacity:0}}
.mascot.sing .bodyg{animation:bob .46s ease-in-out infinite}
.mascot.cheer .bodyg{animation:hop .5s ease-in-out infinite}
.mascot.cheer .wing,.bigbird .wing,.runner .wing{animation:wflap .14s ease-in-out infinite alternate}
@keyframes hop{50%{transform:translateY(-16px) rotate(-6deg)}}
@keyframes wflap{to{transform:rotate(-38deg)}}
.mascot.dance .bodyg,.bigbird .bodyg{animation:dance .6s ease-in-out infinite}
@keyframes dance{25%{transform:rotate(-10deg) translateY(-6px)}75%{transform:rotate(10deg) translateY(-6px)}}
.mascot.sleep .lid,.mascot.calm .lid{animation:none;transform:scaleY(1)}
.mascot.sleep .bodyg,.mascot.calm .bodyg{animation:bob 4s ease-in-out infinite}
.mascot.sleep .zz{opacity:1}
.bubble{position:absolute;right:74px;top:4px;z-index:31;white-space:nowrap;background:#fff;color:var(--ink);border-radius:18px;padding:8px 16px;font-family:var(--display);font-size:22px;font-weight:800;box-shadow:0 8px 24px rgba(22,48,42,.18);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.bubble:after{content:"";position:absolute;right:-9px;top:16px;border:9px solid transparent;border-left-color:#fff;border-right:0}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
/* confetti */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80;width:100%;height:100%}
/* goal journey */
.journey{display:block;width:100%;height:auto;overflow:visible}
.journey .birdpos{transition:transform 1s cubic-bezier(.3,1.6,.5,1)}
/* race */
.track{position:relative;height:40px;border-radius:999px;background:var(--gum-l);margin-top:14px}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--hill);opacity:.55;width:0}
.track .runner{position:absolute;top:-20px;width:58px;height:58px;margin-left:-29px;left:29px;transition:left .3s linear}
.track .runner svg{width:100%;height:100%;overflow:visible}
.track .flag{position:absolute;right:8px;top:-22px}
/* hero */
.hero-badge{border:0;display:inline-flex;align-items:center;gap:8px;background:#2A2360;color:#FFD45C;border-radius:999px;padding:8px 16px;font-size:16px;font-weight:800;font-family:var(--body);animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(255,212,92,.35)}}
.card.night{background:#2A2360;color:#fff}
.card.night .big{color:#FFD45C} .card.night .lead{color:#D9D4FF} .card.night .eyebrow{color:#B8B0FF}
.envelope{width:200px;margin:4px auto;animation:wiggle 2.6s ease-in-out infinite}
@keyframes wiggle{0%,100%,40%{transform:rotate(0)}10%{transform:rotate(-5deg)}20%{transform:rotate(5deg)}30%{transform:rotate(-2deg)}}
.peek{background:rgba(255,255,255,.14);color:#fff;border:2px dashed rgba(255,255,255,.4)}
/* reel + flash */
.pick.spin{filter:blur(1.5px);opacity:.85}
.flash{animation:flashin .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes flashin{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
/* fact */
.fact{background:#2A2360;color:#fff;border-radius:28px;padding:16px 20px;display:flex;gap:14px;align-items:center}
.fact b{display:block;color:#FFD45C;font-size:13px;letter-spacing:.08em;margin-bottom:2px}
.fact span{font-size:19px;line-height:1.3}
/* party + ready */
.bigbird{width:min(240px,40vw);aspect-ratio:1;margin:0 auto}
.bigbird svg{width:100%;height:100%;overflow:visible}
.card.party{background:#2A2360;color:#fff;align-items:center;justify-content:center;text-align:center}
.card.party .big{color:#FFD45C;font-size:clamp(56px,8vw,120px)}
.card.party .lead{color:#fff;font-size:clamp(22px,2.4vw,34px)}
.card.yay{background:var(--wattle);color:#2A1E00;align-items:center;justify-content:center;text-align:center}
.card.yay .big{color:#2A1E00}
/* reset the room */
.reset{position:fixed;inset:0;z-index:50;background:#1E4D6B;color:#fff;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center;padding:40px max(32px,env(safe-area-inset-left,0px))}
.reset h1{font-size:clamp(48px,6vw,96px);line-height:.95;color:#fff}
.reset .rsteps{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.reset .rsteps li{font-family:var(--display);font-size:clamp(22px,2.4vw,34px);padding:10px 18px;border-radius:20px;opacity:.5}
.reset .rsteps li.cur{opacity:1;background:rgba(255,255,255,.14)}
.reset .rsteps li.done{opacity:.75;text-decoration:line-through}
.reset .breathe{background:rgba(255,255,255,.12)} .reset .breathe i{background:rgba(255,255,255,.18)} .reset .breathe em{background:#7FC6E8}
.reset .btn{background:#fff;color:#1E4D6B}
.tool.rst{background:#1E4D6B;color:#fff}
/* rotations */
.stations{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;align-content:start}
.station{border-radius:28px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-height:150px;color:#16302A}
.station .sn{font-family:var(--display);font-size:clamp(24px,2.4vw,34px);line-height:1}
.station .cw{font-family:var(--display);font-size:22px;display:flex;align-items:center;gap:8px}
.station .mem{font-size:16px;opacity:.85}
.stations.moving .station{animation:shake .5s ease-in-out infinite}
@keyframes shake{25%{transform:translateX(-3px) rotate(-.5deg)}75%{transform:translateX(3px) rotate(.5deg)}}
.dot{width:18px;height:18px;border-radius:999px;flex:none;border:2px solid rgba(0,0,0,.15)}
/* reteach */
.rt-show{font-family:var(--display);font-size:clamp(30px,3.6vw,52px);line-height:1.05;padding:22px 26px;border-radius:26px;background:var(--wattle);color:#2A1E00}
.focusrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.focusrow button{border:2px solid var(--gum-m);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px}

.ring.md{max-width:210px}

.phone{position:relative;width:min(380px,100%);height:min(640px,64vh);background:#121212;border-radius:50px;padding:13px;box-shadow:0 22px 44px rgba(0,0,0,.28);flex:none}

.ph-reply{margin:10px 14px 18px;padding:12px 16px;border-radius:999px;background:#fff;border:1px solid #E3E5EC;color:#9A9AAE;font-size:15px}

.ph-banner b{display:block;font-size:17px;color:#111} .ph-banner span{font-size:14px;color:#667}
.ph-ic{width:40px;height:40px;border-radius:12px;background:#34C759;display:grid;place-items:center;flex:none}

/* ---------- Bold looks (own palettes) ---------- */
body.bold{--head:'Lilita One','Baloo 2',system-ui,sans-serif;--display:'Baloo 2',ui-rounded,system-ui,sans-serif;
  background-color:var(--sky);background-image:radial-gradient(rgba(0,0,0,.07) 1.3px,transparent 1.5px);background-size:16px 16px}
body.bold .land,body.bold .cloud{display:none}
body.bold h1,body.bold h2,body.bold .big,body.bold .mid,body.bold .room,body.bold .clock,body.bold .ring .rt b{font-family:var(--head);font-weight:400;letter-spacing:.005em}
body.bold .big{font-size:clamp(50px,6.2vw,96px);line-height:.98}
body.bold .room{font-size:clamp(24px,2.4vw,32px);color:var(--ink)}
body.bold .eyebrow{color:var(--gum)}
body.bold .card{border:3px solid var(--ink);box-shadow:7px 7px 0 var(--ink);border-radius:26px}
body.bold .card.sm{box-shadow:5px 5px 0 var(--ink);border-radius:22px}
body.bold .stage{gap:26px}
body.bold .seg{border:2.5px solid var(--ink);background:var(--panel)}
body.bold .seg.past{background:var(--gum-m);color:var(--ink);border-color:transparent}
body.bold .seg.brk{background:var(--wattle-l)}
body.bold .seg.now{background:var(--hot);color:var(--on-hot)}
body.bold .seg.next{background:var(--wattle);color:var(--ink)}
body.bold .tool,body.bold .btn{border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
body.bold .tool{background:var(--panel)}
body.bold .tool.on{background:var(--ink);color:var(--panel)}
body.bold .tool.att{background:var(--coral);color:#fff}
body.bold .tool.rst{background:var(--gum);color:#fff}
body.bold .btn:active,body.bold .tool:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
body.bold .btn{background:var(--ink);color:var(--panel)} body.bold .btn.alt{background:var(--panel);color:var(--ink)} body.bold .btn.gold{background:var(--wattle);color:var(--ink)} body.bold .btn.coral{background:var(--coral);color:#fff}
body.bold .steps li.cur{background:var(--hot);color:var(--on-hot);border:3px solid var(--ink)}
body.bold .steps li .n{border:2px solid var(--ink)}
body.bold .warn{background:var(--wattle)} body.bold .warn h1{color:var(--ink)!important}
body.bold .task{border:2.5px dashed var(--ink)}
body.bold .bubble{border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font-family:var(--head);font-weight:400}
body.bold .bubble:after{right:-12px}
body.bold .ibtn{border:2.5px solid var(--ink)}
body.bold .msgcard{background:var(--gum-l)}
body.bold .sheet{background:var(--panel)}
/* palettes */
body.pal-grape{--sky:#7B5CFA;--sky-calm:#9C86FB;--dusk:#B48CF5;--panel:#FFFDF7;--ink:#1B1340;--muted:#5A4F7A;--line:#E2DCF5;--gum:#6C4BD8;--gum-d:#3A1FA8;--gum-l:#EEE8FF;--gum-m:#CBBDFF;--hill:#A48BFF;--wattle:#FFD84D;--wattle-l:#FFF3C4;--wattle-ink:#3D2E00;--coral:#FF4F8B;--coral-l:#FFE0EB;--coral-ink:#8A1240;--hot:#FF4F8B;--on-hot:#fff}
body.pal-tomato{--sky:#FF6B4A;--sky-calm:#FF9479;--dusk:#FF8E5E;--panel:#FFF8F0;--ink:#14213D;--muted:#4A5675;--line:#F2DED2;--gum:#2463EB;--gum-d:#14213D;--gum-l:#E4ECFF;--gum-m:#BBCDFF;--hill:#7FA6FF;--wattle:#FFC93C;--wattle-l:#FFF1CC;--wattle-ink:#3D2E00;--coral:#E63946;--coral-l:#FFE1DC;--coral-ink:#7A1220;--hot:#2463EB;--on-hot:#fff}
body.pal-mint{--sky:#6EE7C5;--sky-calm:#9BEFD7;--dusk:#A8E6CF;--panel:#FFFFFF;--ink:#0F2A3D;--muted:#466072;--line:#D3EEE6;--gum:#0E9F7E;--gum-d:#0F2A3D;--gum-l:#DDF8EF;--gum-m:#A6EBD7;--hill:#5FD3B0;--wattle:#FFE066;--wattle-l:#FFF6CC;--wattle-ink:#3D3300;--coral:#FF5D8F;--coral-l:#FFE2EB;--coral-ink:#8A1240;--hot:#FF5D8F;--on-hot:#fff}
/* comic burst */
.burst{position:fixed;left:50%;top:46%;width:min(440px,62vw);aspect-ratio:1;z-index:79;pointer-events:none;animation:burst 1.6s cubic-bezier(.2,1.6,.4,1) forwards}
.burst svg{width:100%;height:100%;overflow:visible}
.burst b{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--head);font-weight:800;font-size:min(84px,11vw);line-height:.9;color:#fff;-webkit-text-stroke:6px var(--ink,#16302A);paint-order:stroke fill;padding:0 18%}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.2) rotate(-30deg);opacity:0}14%{transform:translate(-50%,-50%) scale(1.06) rotate(-7deg);opacity:1}80%{transform:translate(-50%,-50%) scale(1) rotate(-7deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1.15) rotate(-7deg);opacity:0}}
body.bold .tool{padding:6px 11px;font-size:15px;min-height:42px}
body.bold .dock{gap:7px}
body.bold .ring{max-width:240px}
body.bold .ring.md{max-width:200px}
body.bold .date{color:var(--ink);opacity:.8}
body.bold .ring .rt b{font-size:clamp(38px,3.8vw,58px)} body.bold .ring.sm .rt b{font-size:28px} body.bold .ring.md .rt b{font-size:42px}
/* Roomie monster faces */
.m-eyes-shut,.m-eyes-joy,.m-mouth-o,.m-mouth-grin{display:none}
.mascot.sing .m-mouth-smile{display:none}.mascot.sing .m-mouth-o{display:inline}
.mascot.cheer .m-eyes-open,.mascot.dance .m-eyes-open,.bigbird .m-eyes-open{display:none}
.mascot.cheer .m-eyes-joy,.mascot.dance .m-eyes-joy,.bigbird .m-eyes-joy{display:inline}
.mascot.cheer .m-mouth-smile,.mascot.dance .m-mouth-smile,.bigbird .m-mouth-smile{display:none}
.mascot.cheer .m-mouth-grin,.mascot.dance .m-mouth-grin,.bigbird .m-mouth-grin{display:inline}
.mascot.calm .m-eyes-open,.mascot.sleep .m-eyes-open{display:none}
.mascot.calm .m-eyes-shut,.mascot.sleep .m-eyes-shut{display:inline}
.arm-l{transform-origin:30px 76px}.arm-r{transform-origin:90px 76px}
.mascot.cheer .arm-l,.mascot.dance .arm-l,.bigbird .arm-l{animation:armL .3s ease-in-out infinite alternate}
.mascot.cheer .arm-r,.mascot.dance .arm-r,.bigbird .arm-r{animation:armR .3s ease-in-out infinite alternate}
.mascot.sing .arm-l{animation:armL 1s ease-in-out infinite alternate}.mascot.sing .arm-r{animation:armR 1s ease-in-out infinite alternate}
@keyframes armL{from{transform:rotate(18deg)}to{transform:rotate(-22deg)}}
@keyframes armR{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
.monster .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0)}
body.bold .flyby{display:none}
/* feelings check-in */
.feel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.feel button{border:2.5px solid var(--ink);border-radius:18px;padding:8px 10px;display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;color:#1B1340;text-align:left;box-shadow:3px 3px 0 var(--ink)}
.feel button:last-child{grid-column:1 / -1;justify-content:center}
.feel button svg{flex:none;width:38px;height:38px}
.feel button.tapped{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
body.bold .splash .hint,body.bold .splash .lbl{color:var(--ink)}
/* ticket machine */
.tmcard{align-items:center;justify-content:flex-start;background:var(--gum-l);padding-top:24px}
.tm{width:min(470px,100%);display:flex;flex-direction:column;align-items:center}
.tm-box{position:relative;width:100%;background:var(--hot,#FF4F8B);border:3px solid var(--ink);border-radius:28px 28px 14px 14px;box-shadow:6px 6px 0 var(--ink);padding:16px 18px 30px;display:flex;align-items:center;gap:14px;z-index:2}
.tm-face{width:84px;height:84px;flex:none;background:#fff;border:3px solid var(--ink);border-radius:50%;overflow:hidden;display:grid;place-items:center} .tm-face svg{width:76px;height:76px}
.tm-sign{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:3px solid var(--ink);border-radius:16px;padding:10px 14px}
.tm-sign b{font-family:var(--head);font-weight:400;font-size:clamp(22px,2.2vw,30px);line-height:.95;color:var(--ink)}
.tm-led{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:34px;background:#1a0b0b;color:#FF4A3D;border-radius:10px;padding:2px 10px;letter-spacing:.06em;text-shadow:0 0 8px rgba(255,74,61,.7);min-width:68px;text-align:center}
.tm-btn{position:absolute;right:18px;bottom:-14px;width:34px;height:34px;border-radius:50%;background:var(--wattle);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.tm-btn.press{animation:press .3s}
@keyframes press{50%{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}}
.tm-slot{width:82%;height:14px;background:var(--ink);border-radius:0 0 10px 10px;position:relative;z-index:3}
.tm-feed{width:76%;overflow:hidden;margin-top:-4px;padding-bottom:12px}
.tm-paper{transform:translateY(-102%)}
.tm-paper.printing{animation:printout 1.6s cubic-bezier(.4,0,.6,1) forwards}
.tm-paper.out{transform:translateY(0)}
@keyframes printout{0%{transform:translateY(-102%)}20%{transform:translateY(-80%)}35%{transform:translateY(-78%)}60%{transform:translateY(-40%)}72%{transform:translateY(-38%)}100%{transform:translateY(0) rotate(-1.2deg)}}
.ticket{background:#FFFDF2;color:#1B1340;border:3px solid var(--ink);border-top:0;border-radius:0 0 12px 12px;padding:14px 18px 10px;box-shadow:5px 5px 0 rgba(0,0,0,.18);background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(27,19,64,.06) 31px 32px)}
.tk-head{display:flex;justify-content:space-between;font-weight:800;font-size:14px;letter-spacing:.1em;color:var(--gum)}
.tk-t{font-family:var(--head);font-weight:400;font-size:clamp(30px,3vw,42px);line-height:1;margin:8px 0 6px;color:var(--gum-d)}

.tcard.off{opacity:.5}

.thchart{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:auto}

.st{position:relative;border:0;background:transparent;cursor:pointer;padding:0;aspect-ratio:1.1;display:grid;place-items:center}
.st svg{position:absolute;inset:0;width:100%;height:100%;fill:#FFD45C;stroke:#C99A00;stroke-width:.6;transition:transform .3s}
.st b{position:relative;font-family:var(--display);font-weight:800;font-size:clamp(18px,2vw,28px);color:#5A4300;margin-top:6%}
.st.got svg{fill:var(--tc);stroke:var(--tc)} .st.got b{color:#fff}
.st.got:not(.shown) b{opacity:.85}
.st.shown svg{animation:spinflip .6s ease}
@keyframes spinflip{50%{transform:rotateY(90deg)}}
.st:not(.got).shown{opacity:.35}
.qscore{display:flex;flex-direction:column;gap:8px}
.qscore div{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.qscore b{margin-left:auto;font-family:var(--display);font-size:26px}
.floatb{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:auto 0}
.fteam{border:3px solid var(--tc);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fteam>b{font-family:var(--display);font-weight:800;font-size:30px;color:var(--tc)}
.fteam>span{font-weight:800;font-size:20px}
.fdots{display:flex;flex-wrap:wrap;gap:8px}
.fdots i{width:30px;height:30px;border-radius:50%;background:var(--line);opacity:.5;transition:all .3s}
.fdots i.on{background:var(--tc);opacity:1}
@media (max-width:700px){.floatb{grid-template-columns:1fr}.starb{grid-template-columns:repeat(4,1fr)}}
.nudge{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:150px;z-index:38;background:var(--panel);border:3px solid var(--gum);border-radius:22px;padding:14px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:0 14px 34px rgba(60,40,20,.22);max-width:360px;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.nudge small{font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gum-d)}
.nudge b{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}
.prow.flashrow{animation:flashrow 1.6s ease 2}
@keyframes flashrow{50%{box-shadow:0 0 0 4px var(--gum,#E2558F)}}
.feel.big{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:14px;margin-block:auto}
.feel.big button{flex-direction:column;min-height:clamp(150px,22vh,220px);font-size:clamp(20px,1.8vw,28px);gap:10px;justify-content:center}
.feel.big button svg{width:clamp(56px,6vw,90px);height:auto}
.citable{display:flex;flex-direction:column;gap:8px;margin-block:auto}
.cih,.cir{display:grid;grid-template-columns:200px repeat(5,minmax(0,1fr));gap:10px;align-items:center}
.cih span{font-size:14px;font-weight:800;border-bottom:5px solid var(--c);padding-bottom:4px}
.cir{background:var(--panel);border-radius:14px;padding:12px 14px;font-size:22px;font-weight:800}
.cir.now{outline:3px solid var(--gum)}
.cir b{font-family:var(--display);font-size:20px}
.cir span{display:flex;align-items:center;gap:8px}
.cir span i{display:block;height:16px;border-radius:8px;min-width:0}
.feel.big{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.feel.big button:last-child{grid-column:auto}
/* seating plan */
.seatcard{gap:10px}
.seatroom{position:relative;flex:1;min-height:360px;border-radius:22px;background:repeating-linear-gradient(0deg,transparent 0 39px,rgba(120,90,60,.07) 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,rgba(120,90,60,.07) 39px 40px),#FBF3E2;border:2.5px dashed var(--line);overflow:hidden;touch-action:none}
.seatroom .board{position:absolute;left:25%;right:25%;top:10px;text-align:center;background:#4A3F38;color:#FFF6E0;border-radius:10px;padding:5px;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.04em}
.desk{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot,0deg));display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:4px;padding:6px;background:#E9C891;border-radius:12px;box-shadow:0 4px 0 rgba(120,80,30,.25)}
.desk.ed{cursor:grab;outline:2px dashed rgba(74,63,56,.35)} .desk.drag{cursor:grabbing;z-index:5;box-shadow:0 12px 24px rgba(0,0,0,.25)}
.seat{min-width:0;min-height:52px;border:0;border-radius:9px;background:#FFFDF6;color:var(--ink);font:inherit;font-weight:800;font-size:clamp(14px,1.3vw,22px);line-height:1.1;padding:6px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.desk[style*="--rot"] .seat{writing-mode:horizontal-tb}
.seat.empty{background:rgba(255,253,246,.45);color:var(--muted)}
.seat.sel,.chip.uns.sel{outline:3px solid var(--gum);background:var(--gum-l)}
.deskx{position:absolute;top:-10px;right:-10px;width:24px;height:24px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);font-size:12px;cursor:pointer;padding:0}
.seattools{gap:6px;align-items:center}
.seattools select{margin-left:6px}
.chip.uns{cursor:pointer;border:0;font:inherit;font-size:13px;padding:3px 10px}
/* welcome tour */
#tour{position:fixed;inset:0;z-index:90}
.tourhole{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(60,40,30,.55);outline:4px solid #FFD45C;transition:all .35s cubic-bezier(.3,1.3,.5,1);pointer-events:none}
.tourhole.none{left:50%;top:50%;width:0;height:0;outline:0}
.tourcard{position:fixed;width:min(400px,calc(100vw - 24px));background:#FFFDF3;border:3px solid var(--gum,#E2558F);border-radius:24px;padding:16px 18px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 18px 40px rgba(0,0,0,.28);animation:pop .3s cubic-bezier(.2,1.6,.4,1);font-family:var(--body);color:#4A3F38}
.tourcard.center{left:50%;top:50%;transform:translate(-50%,-50%);width:min(500px,calc(100vw - 24px));padding:24px}
.tourbird{width:64px;height:64px;flex:none}
.tourcard.center .tourbird{width:96px;height:96px}
.tourbird svg{width:100%;height:100%;overflow:visible}
.tourtxt{display:flex;flex-direction:column;gap:6px;min-width:0}
.tourtxt small{font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gum-d,#B5306A)}
.tourtxt b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05}
.tourcard.center .tourtxt b{font-size:34px}
.tourtxt p{margin:0;font-size:16px;line-height:1.4}
.tourdots{display:flex;gap:5px;margin:2px 0}
.tourdots i{width:7px;height:7px;border-radius:50%;background:#E3D6BF}
.tourdots i.on{background:var(--gum,#E2558F);width:18px;border-radius:4px}
.tourtxt .row{gap:6px;flex-wrap:wrap}
.deskrot{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.deskrot button{width:26px;height:26px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);font-size:15px;line-height:1;cursor:pointer;padding:0;color:#4A3F38}
.deskrot button:hover,.deskx:hover{background:var(--gum-l,#FFF6C9)}
/* helpers */
.jobgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:4px}
.jobcard{background:var(--jc);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-height:110px;justify-content:center;box-shadow:0 3px 0 rgba(120,90,60,.14)}
.jobcard:nth-child(odd){transform:rotate(-.8deg)} .jobcard:nth-child(even){transform:rotate(.7deg)}
.jobcard .jn{font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:#4A3F38;opacity:.75}
.jobcard b{font-family:var(--display);font-weight:800;font-size:clamp(26px,2.4vw,38px);line-height:1.05;color:#4A3F38}
.jobcard select{font:inherit;font-size:18px;font-weight:700;padding:6px 8px;border-radius:10px;border:2px solid rgba(74,63,56,.2);background:#fff}
.jobedit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.jobedit textarea{font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--panel);width:100%;box-sizing:border-box}
.jobside{display:flex;flex-direction:column;gap:10px}
/* ---- student view ---- */
body.student>*:not(#stu):not(script):not(style){display:none!important}
body.student{background:#F6EEDC;overflow:auto!important}
#stu{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 40px;box-sizing:border-box;font-family:var(--body);color:#4A3F38}
.stuin{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.stubird{width:96px;height:96px;align-self:center}
.stubird svg{width:100%;height:100%;overflow:visible}
#stu h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.1;margin:0;text-align:center;text-wrap:balance}
#stu h1.wait{color:#B5306A}
#stu p{margin:0;font-size:18px;line-height:1.4;text-align:center}
#stu input,#stu textarea{font:inherit;font-size:22px;padding:14px 16px;border-radius:16px;border:3px solid #E3D3B5;background:#FFFDF6;color:#4A3F38;width:100%;box-sizing:border-box}
#stuCode{text-align:center;font-family:var(--display);font-size:44px!important;letter-spacing:.3em;text-transform:uppercase}
.sbtn{font-family:var(--display);font-weight:800;font-size:24px;border:0;border-radius:18px;padding:14px;background:#E2558F;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(120,40,70,.25)}
.sbtn.alt{background:#fff;color:#4A3F38}
.stufeel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stufeel button{border:0;border-radius:20px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font:inherit;font-weight:800;font-size:20px;color:#2E2620;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.stufeel button:last-child{grid-column:1/-1}
.stufeel svg{width:56px;height:56px}
.stupoll{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stupoll button{border:0;border-radius:20px;min-height:90px;font-family:var(--display);font-weight:800;font-size:30px;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.stupoll button:nth-child(5n+1){background:#E2558F}.stupoll button:nth-child(5n+2){background:#E0A400}.stupoll button:nth-child(5n+3){background:#2F8F6B}.stupoll button:nth-child(5n+4){background:#2F7FB0}.stupoll button:nth-child(5n+5){background:#7B61C9}
.stuk{align-self:center;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#B5306A}
.stunote{font-size:14px!important;opacity:.75}
.stuok{color:#2F8F6B;font-weight:800}
.stuerr{color:#C2410C!important;font-weight:700;font-size:16px!important;text-align:center}
.stufoot{font-size:14px!important;opacity:.8;margin-top:10px!important}
.stufoot button{border:0;background:none;font:inherit;text-decoration:underline;color:inherit;cursor:pointer;padding:0}
/* ---- teacher: live tray, wall, join, poll ---- */
.livetray{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:150px;z-index:37;width:290px;background:#FFFDF3;border:3px solid #2F8F6B;border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 28px rgba(60,40,20,.2);font-family:var(--body);color:#4A3F38}
.trh small{display:block;font-weight:800;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:#2F8F6B}
.trh b{font-family:var(--display);font-size:24px}
.trbars{display:flex;flex-direction:column;gap:4px}
.trbars div{display:grid;grid-template-columns:96px 1fr 22px;gap:6px;align-items:center;font-size:13px;font-weight:700}
.trbars i{display:block;height:12px;border-radius:6px;transition:width .4s}
.trbars b{text-align:right}
.trlast p{margin:0 0 4px;font-size:14px;background:#FFF1A8;border-radius:10px;padding:6px 9px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.livewall{position:fixed;inset:0;z-index:65;background:#F6EEDC;padding:24px max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;font-family:var(--body);color:#4A3F38;overflow:auto}
.lwh{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.lwh small{font-weight:800;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:#B5306A}
.lwh h2{font-family:var(--display);font-size:clamp(26px,2.8vw,42px);margin:2px 0 0;line-height:1.1}
.lwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;align-content:start}
.note{border-radius:6px;padding:16px 16px 12px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transform:rotate(var(--r));box-shadow:0 6px 14px rgba(80,50,20,.16)}
.note p{margin:0;font-size:clamp(17px,1.4vw,22px);font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.note small{font-weight:800;font-size:14px;opacity:.7}
.joincard{gap:14px}
.joinrow{display:flex;gap:32px;align-items:center;flex-wrap:wrap}
.joinqr{width:280px;height:280px;background:#FFFDF6;border-radius:20px;padding:10px;box-sizing:border-box;display:grid;place-items:center;box-shadow:0 3px 0 rgba(120,90,60,.15)}
.joinqr img,.joinqr canvas{width:260px!important;height:260px!important}
.jointxt{display:flex;flex-direction:column;gap:8px;min-width:0}
.joinurl{font-family:var(--display);font-weight:800;font-size:clamp(22px,2.2vw,34px);color:#2F7FB0;overflow-wrap:anywhere}
.joincode{font-family:var(--display);font-weight:800;font-size:clamp(70px,9vw,140px);letter-spacing:.12em;line-height:1;color:#B5306A}
.pollbars{display:flex;flex-direction:column;gap:14px;margin-block:auto}
.pb{display:grid;grid-template-columns:minmax(80px,auto) 1fr 70px;gap:14px;align-items:center}
.pbl{font-family:var(--display);font-weight:800;font-size:clamp(24px,2.4vw,36px)}
.pbt{height:46px;background:rgba(74,63,56,.08);border-radius:14px;overflow:hidden}
.pbt i{display:block;height:100%;border-radius:14px;transition:width .6s cubic-bezier(.3,1.3,.5,1)}
.pb b{font-family:var(--display);font-size:34px;text-align:right}
.pollbars.hidden .pbt{background:repeating-linear-gradient(45deg,rgba(74,63,56,.06) 0 12px,rgba(74,63,56,.12) 12px 24px)}
.pollcount{font-family:var(--display);font-weight:800;font-size:110px;line-height:1;color:#B5306A}
.trchips{display:flex;gap:5px}
.trchips span{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px;padding:5px 2px;font-size:15px}
.trchips svg{width:24px;height:24px}
.livetray{width:270px;bottom:20px;right:330px}
body.mode-tools .livetray{right:330px}
.pollcount{margin-top:22px}
.livebtn.has{animation:none}
.lwcode{font-family:var(--display);font-size:22px;align-self:center;margin-right:8px}
.lwcode b{color:#B5306A;letter-spacing:.08em}
.card.mirror{gap:12px;overflow:hidden}
.card.mirror .mgrid{flex:1 1 auto;min-height:0}
.card.mirror .mstep{overflow:auto}
.card.mirror .mstep textarea{min-height:56px;resize:none}

/* ---------- Scrapbook look ---------- */
body.scrap{--acc:#E2558F;--sky:#EFE6CC;--sky-calm:#E8E3D2;--dusk:#F2E0C4;--panel:#FFFDF3;--ink:#2B2B2B;--muted:#6A6458;--line:#E6DDC4;
  --gum:var(--acc);--gum-d:#2B2B2B;--gum-l:#FFF3B8;--gum-m:#CFE6F7;--hill:#9BD3B0;--wattle:#FFE36E;--wattle-l:#FFF6C9;--wattle-ink:#3A3000;
  --coral:#F2785C;--coral-l:#FDE3DC;--coral-ink:#8A2E17;--hot:#FFE36E;--on-hot:#2B2B2B;
  --head:'Chewy','Baloo 2',system-ui,sans-serif;--hand:'Patrick Hand','Nunito',system-ui,sans-serif;
  background-color:var(--sky);
  background-image:linear-gradient(rgba(120,100,60,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(120,100,60,.13) 1px,transparent 1px);background-size:28px 28px}
body.scrap .land,body.scrap .cloud,body.scrap .flyby{display:none}
body.scrap h1,body.scrap h2,body.scrap .big,body.scrap .mid,body.scrap .clock,body.scrap .ring .rt b{font-family:var(--head);font-weight:400;letter-spacing:.01em}
body.scrap .room{font-family:var(--head);font-weight:400;font-size:clamp(26px,2.5vw,34px);color:var(--ink)}
body.scrap .eyebrow,body.scrap .hint,body.scrap .date,body.scrap .tk-head,body.scrap .tk-stub,body.scrap .lead{font-family:var(--hand);letter-spacing:.02em;text-transform:none}
body.scrap .eyebrow{font-size:22px;color:#6A6458}
body.scrap .lead{font-size:clamp(20px,1.8vw,26px)}
body.scrap .big{font-size:clamp(54px,6.4vw,100px);line-height:1}
/* cut-out letters */
.rl{display:inline-block;-webkit-text-stroke:0;text-shadow:3px 0 0 #fff,-3px 0 0 #fff,0 3px 0 #fff,0 -3px 0 #fff,2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,4px 5px 0 rgba(0,0,0,.18)}
/* paper cards with tape */
body.scrap .card{background:var(--panel);border-radius:6px;border:0;box-shadow:0 2px 0 rgba(0,0,0,.06),3px 6px 14px rgba(80,60,20,.18);position:relative;
  background-image:linear-gradient(transparent 0 0);}
body.scrap .card.sm{border-radius:6px}
body.scrap .stage>.card:first-child::before,body.scrap .side>.card:first-child::before{content:"";position:absolute;top:-2px;left:50%;width:120px;height:30px;margin-left:-60px;transform:rotate(-3deg);background:rgba(250,210,120,.75);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 6px,transparent 6px 12px);z-index:2;pointer-events:none}
body.scrap .side>.card:nth-child(2)::before{content:"";position:absolute;top:-6px;right:24px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a8a,#d93a3a);box-shadow:1px 2px 2px rgba(0,0,0,.3);z-index:2}
body.scrap .card.warn{background:#FFF1A8}
body.scrap .card.yay{background:#FFF1A8}
body.scrap .card.party,body.scrap .card.night,body.scrap .fact{background:#3B3355}
/* torn paper strip behind the header */
body.scrap .top{position:relative}
/* day strip as paper tabs */
body.scrap .seg{background:#FFFDF3;border:2px solid var(--ink);border-radius:8px 8px 3px 3px;font-family:var(--hand);font-size:17px;font-weight:400}
body.scrap .seg.past{background:#E8DFC4;color:#6A6458;border-color:#C9BD9A}
body.scrap .seg.brk{background:#FFF6C9}
body.scrap .seg.now{background:var(--acc);color:#fff}
body.scrap .seg.next{background:#FFE36E}
/* buttons and tools as paper tags */
body.scrap .tool{background:#FFFDF3;border:2px solid var(--ink);border-radius:10px;font-family:var(--hand);font-size:18px;font-weight:400;box-shadow:2px 3px 0 rgba(0,0,0,.15);padding:4px 12px}
body.scrap .tool:nth-child(odd){transform:rotate(-1.2deg)} body.scrap .tool:nth-child(even){transform:rotate(1deg)}
body.scrap .tool.on{background:#2B2B2B;color:#FFFDF3}
body.scrap .tool.att{background:var(--acc);color:#fff} body.scrap .tool.rst{background:#4A9FE0;color:#fff}
body.scrap .btn{border:2px solid var(--ink);border-radius:12px;box-shadow:3px 4px 0 rgba(0,0,0,.18);background:#2B2B2B;color:#FFFDF3}
body.scrap .btn.alt{background:#FFFDF3;color:var(--ink)} body.scrap .btn.gold{background:#FFE36E;color:var(--ink)} body.scrap .btn.coral{background:var(--acc);color:#fff}
body.scrap .ibtn{background:#FFFDF3;border:2px solid var(--ink)}
/* highlighter for the current step */
body.scrap .steps li.cur{background:linear-gradient(transparent 12%,#FFE36E 12%,#FFE36E 88%,transparent 88%);color:var(--ink);border-radius:4px;transform:rotate(-.6deg)}
body.scrap .steps li .n{background:#fff;border:2px solid var(--ink);color:var(--ink)}
body.scrap .steps li.done .n{background:#9BD3B0}
/* sticky notes */
body.scrap .task{background:#FFF1A8;border-radius:2px;transform:rotate(-1deg);box-shadow:2px 6px 10px rgba(80,60,20,.2);font-family:var(--head);font-weight:400;color:var(--ink);position:relative}

    else { f.type='bandpass'; f.frequency.value=ch==='c'?1500:1900; g.gain.setValueAtTime(ch==='c'?0.22:0.18,t); g.gain.exponentialRampToValueAtTime(0.0001,t+(ch==='c'?0.12:0.16)); }
    s.connect(f); f.connect(g); g.connect(musicBus); s.start(t); s.stop(t+0.2); },
  schedStep(i,t){ const s=this.song, e=60/s.bpm/2, bars=s.mel.length, bar=Math.floor(i/8)%bars, slot=i%8;
    const toks=s.mel[bar].split(' '); const tk=toks[slot];
    if(tk && tk!=='-' && tk!=='.'){ let len=1; for(let j=slot+1;j<8&&toks[j]==='-';j++) len++; const m=this.deg(s,parseInt(tk,10)); this.note(this.midi(m),t,len*e*0.95, s.soft?'sine':'triangle', s.soft?0.13:0.16, s.soft?1800:3200); }
    const chordDeg=s.prog[bar%s.prog.length];
    const bassM=this.deg(s,chordDeg)-24;
    if(s.bass==='pulse' && slot%1===0) this.note(this.midi(bassM),t,e*0.8,'sine',0.22,600);
    if(s.bass==='quarter' && slot%2===0) this.note(this.midi(bassM),t,e*1.7,'sine',0.24,600);
    if(s.bass==='long' && slot===0) this.note(this.midi(bassM),t,e*7.5,'sine',0.18,500);
    if(s.pad && slot===0) [0,2,4].forEach(k=>this.note(this.midi(this.deg(s,chordDeg+k)-12),t,e*7.8,'sawtooth',0.025,900));
    if(s.drums){ const d=s.drums[0].split(' ')[slot]; if(d && d!=='.') d.split('').forEach(c=>this.drum(c,t)); }
  },
  async play(key, routineId){
    this.stop(); const a=audio(); if(!a) return;
    if(key==='youtube'){ const r=routineById(routineId); if(r&&r.yt){ this.isYT=true; this.playing=true; this.paused=false; this.title='YouTube video'; YT_.play(r); updateNowPlaying(); return; } key='tidy'; }
    if(key==='own' && routineId){ const blob=await idbGet('song-'+routineId).catch(()=>null);
      if(blob){ const el=new Audio(URL.createObjectURL(blob)); el.loop=true; el.volume=musicVol; this.fileAudio=el; el.play().catch(()=>{}); this.playing=true; this.title='Your song'; updateNowPlaying(); return; }
      key='tidy'; }
    const s=SONGS[key]; if(!s) return; this.song=s; this.title=s.title; this.step=0; this.next=a.currentTime+0.08; this.playing=true; this.paused=false;
    musicBus.gain.cancelScheduledValues(a.currentTime); musicBus.gain.setValueAtTime(musicVol,a.currentTime);
    this.timer=setInterval(()=>{ if(this.paused) return; const e=60/this.song.bpm/2; while(this.next<AC.currentTime+0.15){ this.schedStep(this.step,this.next); this.next+=e; this.step++; } },25);
    updateNowPlaying();
  },
  pause(){ if(this.isYT){ YT_.pause(); this.paused=true; updateNowPlaying(); return; } if(this.fileAudio){ this.fileAudio.pause(); } this.paused=true; if(AC) musicBus.gain.setTargetAtTime(0.0001,AC.currentTime,0.03); updateNowPlaying(); },
  resume(){ if(!this.playing) return; if(this.isYT){ YT_.resume(); this.paused=false; updateNowPlaying(); return; } if(this.fileAudio){ this.fileAudio.play().catch(()=>{}); } else if(AC){ this.next=AC.currentTime+0.05; musicBus.gain.setTargetAtTime(musicVol,AC.currentTime,0.03);} this.paused=false; updateNowPlaying(); },
  stop(){ if(this.isYT){ YT_.stop(); this.isYT=false; } clearInterval(this.timer); this.timer=null; if(this.fileAudio){ this.fileAudio.pause(); URL.revokeObjectURL(this.fileAudio.src); this.fileAudio=null; } this.playing=false; this.paused=false; this.song=null; updateNowPlaying(); },
  fadeStop(){ if(this.isYT){ YT_.fade(()=>this.stop()); return; } if(AC&&this.song){ musicBus.gain.setTargetAtTime(0.0001,AC.currentTime,0.4); setTimeout(()=>this.stop(),1500); } else this.stop(); },
  volume(d){ musicVol=Math.max(0.05,Math.min(1,musicVol+d)); if(musicBus&&!this.paused) musicBus.gain.setTargetAtTime(musicVol,AC.currentTime,0.05); if(this.fileAudio) this.fileAudio.volume=musicVol; if(this.isYT) YT_.vol(musicVol); toast('Music volume '+Math.round(musicVol*100)+'%'); }
};

const YT_ = { player:null, ready:null, routine:null, fadeH:null, start:0,
  parse(url){ url=String(url||'').trim(); let id=null, t=0;
    const m=url.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
    if(m) id=m[1]; else if(/^[A-Za-z0-9_-]{11}$/.test(url)) id=url;
    const tm=url.match(/[?&#](?:t|start)=(\d+h)?(\d+m)?(\d+)?s?/); if(tm) t=(parseInt(tm[1])||0)*3600+(parseInt(tm[2])||0)*60+(parseInt(tm[3])||0);
    return id?{id:id,t:t}:null; },
  secs(s){ s=String(s||'').trim(); if(!s) return null; const p=s.split(':').map(Number); if(p.some(isNaN)) return null; return p.reduce((a,b)=>a*60+b,0); },
  load(){ if(this.ready) return this.ready;
    this.ready=new Promise((res,rej)=>{ if(window.YT&&window.YT.Player) return res(); const prev=window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady=()=>{ if(prev) try{prev();}catch(e){} res(); };
      const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; s.onerror=()=>rej(new Error('blocked')); document.head.appendChild(s);
      setTimeout(()=>rej(new Error('timeout')),8000); });
    this.ready.catch(()=>{ this.ready=null; }); return this.ready; },
  card(show){ const c=$('#ytCard'); if(c){ c.hidden=!show; c.style.visibility=''; } },
  async play(r){ const v=this.parse(r.yt); if(!v){ toast('That YouTube link doesn’t look right. Check it in Setup.'); return; }
    const st=this.secs(r.ytStart); const start = st!=null ? st : (v.t||0); this.routine=r; this.start=start;
    $('#ytLink').href='https://www.youtube.com/watch?v='+v.id+(start?'&t='+start+'s':''); $('#ytMsg').textContent=''; this.card(true);
    try{ await this.load(); }catch(e){ if(this.routine===r) $('#ytMsg').textContent='YouTube can’t play inside this preview. It plays on your Roomie website. Use “Open on YouTube” for now.'; return; }
    if(this.routine!==r) return;
    if(this.player){ try{ this.player.loadVideoById({videoId:v.id,startSeconds:start}); this.player.setVolume(Math.round(musicVol*100)); }catch(e){} return; }
    $('#ytHost').innerHTML='<div id="ytFrame"></div>';
    this.player=new YT.Player('ytFrame',{ host:'https://www.youtube-nocookie.com', width:'100%', height:'200', videoId:v.id,
      playerVars:{start:start, autoplay:1, rel:0, playsinline:1},
      events:{ onReady:e=>{ try{ e.target.setVolume(Math.round(musicVol*100)); if(this.routine) e.target.playVideo(); }catch(err){} },
        onStateChange:e=>{ if(e.data===0 && Music.isYT && T.running){ try{ e.target.seekTo(this.start,true); e.target.playVideo(); }catch(err){} } },
        onError:e=>{ $('#ytMsg').textContent=(e.data===101||e.data===150)?'This video’s owner doesn’t allow it to play on other websites. Use “Open on YouTube”, or choose another video in Setup.':'This video couldn’t play. Check the link in Setup.'; } } });
  },
  pause(){ try{ this.player&&this.player.pauseVideo(); }catch(e){} },
  resume(){ try{ this.player&&this.player.playVideo(); }catch(e){} },
  vol(v){ try{ this.player&&this.player.setVolume(Math.round(v*100)); }catch(e){} },
  stop(){ clearInterval(this.fadeH); this.routine=null; try{ this.player&&this.player.stopVideo(); }catch(e){} this.card(false); },
  fade(done){ if(!this.player){ done(); return; } let v=Math.round(musicVol*100); clearInterval(this.fadeH);
    this.fadeH=setInterval(()=>{ v-=8; if(v<=0){ clearInterval(this.fadeH); done(); return; } try{ this.player.setVolume(v); }catch(e){ clearInterval(this.fadeH); done(); } },120); }
};

/* ---------- IndexedDB for teachers' own songs ---------- */
function idb(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open('bellbird',1); r.onupgradeneeded=()=>r.result.createObjectStore('files'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); }
async function idbPut(k,v){ const d=await idb(); return new Promise((res,rej)=>{ const t=d.transaction('files','readwrite'); t.objectStore('files').put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
async function idbGet(k){ const d=await idb(); return new Promise((res,rej)=>{ const r=d.transaction('files').objectStore('files').get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbClear(){ const d=await idb(); return new Promise(res=>{ const t=d.transaction('files','readwrite'); t.objectStore('files').clear(); t.oncomplete=res; }); }

  const bl=blocksToday(d); let prevEnd=-1; const out=[];
  bl.forEach(b=>{ const st=Math.max(toMin(b.start),prevEnd); let en=toMin(b.end)+(A.ext[b.id]||0); if(en<st+1) en=st+1; out.push({b,st,en}); prevEnd=en; });

}
function phaseAt(d){
  if(S.mode==='tools') return {phase:'tools',mins:d.getHours()*60+d.getMinutes()+d.getSeconds()/60,day:[]};
  const day=computeDay(d), mins=d.getHours()*60+d.getMinutes()+d.getSeconds()/60;

    const nx=day.find(x=>x.st>mins); return {phase:'gap',mins,day,next:nx}; }
  const {b,st,en}=day[i], nx=day[i+1]||null;

const MT={ total:0,left:0,endAt:0,running:false,onDone:null,h:null,
  start(sec,onDone){ this.total=sec; this.left=sec; this.onDone=onDone||null; this.resume(); },
  resume(){ if(this.left<=0) return; this.running=true; this.endAt=Date.now()+this.left*1000; clearInterval(this.h); this.h=setInterval(()=>this.tick(),250); },
  pause(){ if(!this.running) return; this.left=Math.max(0,(this.endAt-Date.now())/1000); this.running=false; clearInterval(this.h); },
  stop(){ this.running=false; clearInterval(this.h); this.left=0; this.total=0; this.onDone=null; },
  add(sec){ if(this.running) this.endAt+=sec*1000; else this.left=Math.max(0,this.left+sec); this.total=Math.max(this.total,this.remaining()); },
  remaining(){ return this.running?Math.max(0,(this.endAt-Date.now())/1000):this.left; },
  tick(){ if(this.running && this.remaining()<=0){ this.running=false; this.left=0; clearInterval(this.h); const f=this.onDone; this.onDone=null; if(f) f(); } }
};

/* noise meter */
const N={on:false,stream:null,an:null,raf:0,lvl:0}; const NOISE_MAX=[2,4,6,8,10];
function paintMeter(){ const l=Math.round(N.lvl); const t=NOISE_MAX[S.noiseTarget]||4; const html=Array.from({length:10},(_,i)=>{ const lit=N.on&&i<l; return '<i class="'+(!lit?'':(i<t?'g':(i<t+1?'y':'r')))+'"></i>'; }).join(''); const m=$('#meter'); if(m) m.innerHTML=html; if(A.pipDoc){ const pm=A.pipDoc.getElementById('pmeter'); if(pm) pm.innerHTML=html; } }
async function noiseOn(){ try{ const a=audio(); const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}); N.stream=st; const src=a.createMediaStreamSource(st); N.an=a.createAnalyser(); N.an.fftSize=1024; src.connect(N.an); N.on=true; const buf=new Float32Array(N.an.fftSize);
  const loop=()=>{ N.an.getFloatTimeDomainData(buf); let s=0; for(let i=0;i<buf.length;i++) s+=buf[i]*buf[i]; const db=20*Math.log10(Math.sqrt(s/buf.length)+1e-8); const l=Math.max(0,Math.min(10,(db+62)/4)); N.lvl=N.lvl*0.85+l*0.15; paintMeter(); N.raf=requestAnimationFrame(loop); }; loop(); render(true); }
  catch(e){ toast('Microphone blocked. Allow it in the address bar. It works on your Roomie website, not in previews.'); } }
function noiseOff(){ cancelAnimationFrame(N.raf); if(N.stream) N.stream.getTracks().forEach(t=>t.stop()); N.on=false; N.stream=null; N.lvl=0; paintMeter(); render(true); }

/* ================= Floating mini window (Document Picture-in-Picture) ================= */
async function floatOpen(){
  if(A.pip){ A.pip.close(); return; }
  if(!('documentPictureInPicture' in window)){ toast('Floating needs Chrome or Edge (or Firefox) on a laptop or desktop. On this device, switch tabs instead.'); return; }
