/* ================= Phase engine tick ================= */
function phaseSig(P){ return [P.phase,P.block?P.block.id:'',P.routine?P.routine.id:'',P.where||''].join('|'); }
function tick(force){ if(STUDENT) return;
  const d=now(); const P=phaseAt(d); A.P=P;
  $('#clock').textContent=fmtClock(d.getHours()*60+d.getMinutes());
  const sig=phaseSig(P);
  if(sig!==A.phaseKey||force){
    const prev=A.phaseKey; A.phaseKey=sig; lastStep=-1;
    if(prev && sig!==prev){ onPhaseChange(P,prev); }
    else if(!prev && P.phase==='routine' && !A.overlay){ if(Music.playing) {} }
    render(true);
  } else render(false);
  Bird.update();
  pipRender(false);
}
function onPhaseChange(P,prev){
  Focus.stop();
  if(A.overlay==='rotate'){ if(P.phase==='warning') toast('Heads up: 2 minutes left in '+P.block.name+'.'); else if(P.block) toast('Now: '+P.block.name+'. Stop rotations when you’re ready.'); return; }
  setTimeout(()=>phaseLine(P),400);
  if(A.overlay && A.overlay!=='door'){ A.overlay=null; MT.stop(); clearActivity(); markTools(); }
  if(A.overlay==='door' && P.phase!=='lesson'){ A.overlay=null; markTools(); }
  if(P.phase==='routine'){ if(S.autoStart||P.where==='start'){ const R=P.routine; if(R.song&&R.song!=='none') Music.play(R.song,R.id); else Music.fadeStop(); chime(1); say(R.name+'. '+(stepsOf(R)[0]||'')); } }
  else { if(Music.playing) Music.fadeStop(); }
  if(P.phase==='warning'){ chime(1); say('Two minutes to finish up.'); }
  if(P.phase==='exit'||P.phase==='entry'){ chime(1); say(P.phase==='exit'?'Exit ticket time.':'Entry ticket time.'); }
  if(P.phase==='routine' && !S.autoStart && P.where==='end' && !A.hold[P.block.id]){ A.hold[P.block.id]=true; }
}

  if(a==='close'){ closeOverlay(); return; }

function nextChangeMin(){ const P=phaseAt(now()); const pts=[]; (P.day||[]).forEach(x=>{ pts.push(x.st); const R0=x.b.startR&&routineById(x.b.startR), R1=x.b.endR&&routineById(x.b.endR); if(R0) pts.push(x.st+R0.minutes); if(x.b.entry&&x.b.kind==='lesson'){ const es=x.st+(R0?R0.minutes:0); pts.push(es+EXIT_MIN); } const r1s=R1?x.en-R1.minutes:x.en; const xs=x.b.exit&&x.b.kind==='lesson'?r1s-EXIT_MIN:r1s; if(xs!==r1s) pts.push(xs); if(x.b.warn) pts.push(xs-2); if(R1) pts.push(r1s); pts.push(x.en); if(x.b.kind==='lesson'&&typeof cuesOf==='function') cuesOf({block:x.b,st:x.st,en:x.en,xs}).forEach(c=>pts.push(c.at)); }); return pts.filter(p=>p>P.mins+0.02).sort((a,b)=>a-b)[0]; }

  return '<div class="relief" id="reliefDoc"><h2>Relief teacher guide · '+esc(S.room)+'</h2><p style="margin:0">'+esc(DAYNAME[k])+'. Roomie runs the timetable, warnings and routines on the board. You only need to follow along.</p><h3>Today</h3><table><tbody>'+day.map(b=>'<tr><td style="width:90px">'+fmtClock(toMin(b.start))+'</td><td>'+esc(b.name)+'</td><td>'+esc([b.startR&&('Starts with '+(routineById(b.startR)||{}).name), b.endR&&('ends with '+(routineById(b.endR)||{}).name), b.exp&&S.expect[b.exp]&&S.expect[b.exp].name].filter(Boolean).join(' · '))+'</td></tr>').join('')+'</tbody></table><h3>Signals the class knows</h3><ul style="margin:0"><li><b>Attention:</b> press A (or the coral Attention button). A chime plays and the board says “Eyes this way”.</li><li><b>Voice levels:</b> 0 silent, 1 whisper, 2 partner, 3 group, 4 presenting.</li><li><b>Tickets:</b> tap Tickets for an entry or exit ticket.</li><li><b>Someone at the door:</b> press D. The board tells the class to keep going.</li><li><b>Late arrival:</b> press L. The board shows them what to do.</li></ul><h3>Routines</h3>'+S.routines.map(r=>'<p style="margin:0"><b>'+esc(r.name)+'</b> ('+r.minutes+' min): '+esc(stepsOf(r).join(' → '))+'</p>').join('')+(S.reliefNotes?'<h3>Notes from '+esc(S.teacher)+'</h3><p style="margin:0;white-space:pre-line">'+esc(S.reliefNotes)+'</p>':'')+'</div>'; }
function reliefText(){ const el=document.getElementById('reliefDoc'); return el?el.innerText:''; }
document.addEventListener('click',e=>{ const t=e.target.closest('#sheetHost button'); if(!t) return;
  if(t.dataset.tab){ tab=t.dataset.tab; renderSetup(); return; }
  if(t.dataset.acc){ S.accent=t.dataset.acc; if(S.theme!=='scrap') S.theme='scrap'; save(); applyTheme(); redrawMascot(); renderSetup(); return; }
  if(t.dataset.rc){ S.roomieCol=t.dataset.rc; save(); redrawMascot(); renderSetup(); return; }
  if(t.dataset.daypos){ S.dayPos=t.dataset.daypos; save(); applyTheme(); render(true); renderSetup(); return; }
  if(t.dataset.look){ S.theme=t.dataset.look; save(); applyTheme(); redrawMascot(); renderSetup(); return; }
  if(t.dataset.day){ editDay=t.dataset.day; planOpen=-1; renderSetup(); return; }
  if(t.dataset.popen!=null){ planOpen=+t.dataset.popen; renderSetup(); if(planOpen>=0) setTimeout(()=>{ const r=document.querySelector('.pedit'); if(r) r.scrollIntoView({block:'nearest'}); },50); return; }
  if(t.dataset.er){ editR=t.dataset.er; renderSetup(); return; }
  if(t.dataset.del!==undefined){ S.days[editDay].splice(+t.dataset.del,1); save(); renderSetup(); return; }
  const a=t.dataset.sact; if(!a) return;
  if(a==='done') return closeSetup();
  if(a==='addBlock'){ const list=S.days[editDay]; const last=list[list.length-1]; const st=last?last.end:'09:00'; const en=fmtHHMM(toMin(st)+30); list.push({id:uid(),start:st,end:en,name:'New block',kind:'lesson',startR:'',endR:'',exp:'own',warn:true,materials:''}); planOpen=list.length-1; save(); renderSetup(); return; }
  if(a==='copyAll'){ DAYS.forEach(k=>{ if(k!==editDay) S.days[k]=S.days[editDay].map(b=>Object.assign({},b,{id:uid()})); }); save(); toast('Copied to every day. Change any day you need to.'); return; }
  if(a==='addR'){ const r={id:uid(),name:'New routine',minutes:3,song:'switch',auto:true,steps:'First step\nSecond step'}; S.routines.push(r); editR=r.id; save(); renderSetup(); return; }
  if(a==='delR'){ $('#delMsg').innerHTML='<div class="warnbox row" style="justify-content:space-between">Delete this routine? Blocks that use it will stop using it.<button class="btn sm coral" type="button" data-sact="delRYes">Delete</button></div>'; return; }
  if(a==='delRYes'){ S.routines=S.routines.filter(r=>r.id!==editR); DAYS.forEach(k=>S.days[k].forEach(b=>{ if(b.startR===editR) b.startR=''; if(b.endR===editR) b.endR=''; })); editR=null; save(); renderSetup(); return; }
  if(a==='resetBest'){ const r=routineById(editR); delete r.best; save(); renderSetup(); return; }
  if(a==='tryR'){ const id=editR; closeSetup(); runRoutine(id); return; }
  if(a==='copyRelief'){ const txt=reliefText(); const ok=()=>{$('#reliefMsg').innerHTML='<div class="okbox">Copied. Paste it into an email or your relief folder.</div>';}; try{ navigator.clipboard.writeText(txt).then(ok).catch(()=>sel()); }catch(err){ sel(); } function sel(){ const r=document.createRange(); r.selectNodeContents($('#reliefDoc')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); $('#reliefMsg').innerHTML='<div class="okbox">Selected. Press Ctrl+C (or ⌘C) to copy.</div>'; } return; }
  if(a==='demoStart'){ closeSetup(); startDemo(); return; }
  if(a==='testFun'){ closeSetup(); audio(); setTimeout(()=>celebrate('Woohoo, '+S.room+'!','big'),300); return; }
  if(a==='demoNext'){ const m=nextChangeMin(); if(m==null){ toast('No more changes today.'); return; } jumpTo(m-10/60); renderSetup(); return; }
  if(a==='demoReal'){ clockOffset=0; $('#demoTag').hidden=true; A.phaseKey=''; tick(true); renderSetup(); return; }
  if(a==='copyBackup'){ const ta=$('#fBackup'); const ok=()=>{$('#privMsg').innerHTML='<div class="okbox">Backup copied.</div>';}; try{ navigator.clipboard.writeText(ta.value).then(ok).catch(()=>{ ta.focus(); ta.select(); $('#privMsg').innerHTML='<div class="okbox">Selected. Press Ctrl+C (or ⌘C) to copy.</div>'; }); }catch(err){ ta.select(); } return; }
  if(a==='restore'){ try{ const o=JSON.parse($('#fBackup').value); if(!o||!o.days||!Array.isArray(o.routines)) throw 0; S=Object.assign(defaults(o.band),o); save(); $('#privMsg').innerHTML='<div class="okbox">Restored.</div>'; }catch(err){ $('#privMsg').innerHTML='<div class="warnbox">That isn’t a Roomie backup. Copy the whole backup text and try again.</div>'; } return; }
  if(a==='erase'){ $('#privMsg').innerHTML='<div class="warnbox row" style="justify-content:space-between">Erase your class, plan, routines and audio files from this computer? This can’t be undone.<button class="btn sm coral" type="button" data-sact="eraseYes">Erase</button></div>'; return; }
  if(a==='eraseYes'){ try{ localStorage.removeItem('bellbird.v2'); }catch(err){} idbClear().catch(()=>{}); S=defaults(S.band); save(); renderSetup(); return; }
});
function fmtHHMM(m){ return pad(Math.floor(m/60)%24)+':'+pad(m%60); }
document.addEventListener('input',e=>{ const el=e.target; if(!el.closest('#sheetHost')) return;
  const row=el.closest('.prow'); if(row&&el.dataset.f){ const b=S.days[editDay][+row.dataset.i]; const f=el.dataset.f; b[f]=el.type==='checkbox'?el.checked:el.value; if(f==='entryT'||f==='exitT'){ const k=f==='entryT'?'entry':'exit'; b[k]=b[f]!=='none'; if(b[f]==='none') b[f]=''; const cb=row.querySelector('[data-f="'+k+'"]'); if(cb) cb.checked=b[k]; } if(f==='entry'||f==='exit'){ const sel=row.querySelector('[data-f="'+f+'T"]'); if(sel) sel.value=b[f]?(b[f+'T']||''):'none'; } save(); return; }
  if(el.id==='autoStart'){ S.autoStart=el.checked; save(); return; }
  if(el.id==='fRoom'){ S.room=el.value||'My class'; save(); return; }

/* ---- sounds ---- */
function sfxOK(){ return S.sfx!==false && !!audio(); }
function tone(f,t,d,type,vol,dest){ const o=AC.createOscillator(), g=AC.createGain(); o.type=type||'triangle'; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(dest||master); o.start(t); o.stop(t+d+0.05); return o; }
function fanfare(){ if(!sfxOK()) return; const t=AC.currentTime+0.03; [[523,0,.16],[659,.14,.16],[784,.28,.16],[1047,.44,.9]].forEach(([f,s,d])=>{ tone(f,t+s,d,'triangle',0.2); tone(f*2,t+s,d*0.6,'sine',0.05); }); [523,659,784].forEach(f=>tone(f,t+0.44,1.1,'sawtooth',0.025)); }
function pop(){ if(!sfxOK()) return; const t=AC.currentTime; const o=tone(700,t,0.14,'sine',0.28); o.frequency.exponentialRampToValueAtTime(1700,t+0.09); tone(2093,t+0.08,0.5,'sine',0.08); }
function blip(){ if(!sfxOK()) return; tone(1250,AC.currentTime,0.09,'sine',0.07); }
function drumroll(sec){ if(!sfxOK()) return; NB=NB||noiseBuf(); const n=Math.floor(sec*24), a=AC;
  for(let i=0;i<n;i++){ const t=a.currentTime+i/24; const s=a.createBufferSource(); s.buffer=NB; const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1700; const g=a.createGain(); g.gain.setValueAtTime(0.04+0.16*(i/n),t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.06); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+0.08); }
  const t2=a.currentTime+sec; tone(90,t2,0.5,'sine',0.45); const s=a.createBufferSource(); s.buffer=NB; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=4000; const g=a.createGain(); g.gain.setValueAtTime(0.25,t2); g.gain.exponentialRampToValueAtTime(0.0001,t2+0.3); s.connect(f); f.connect(g); g.connect(master); s.start(t2); s.stop(t2+0.3); }

const CONF=['#F5B700','#F2785C','#2F8F6B','#7CC79A','#47B3D6','#FFFFFF','#FFD45C'];
let CF=null;
function confetti(n,el){ if(reduced()) return; const mult=S.fun==='party'?1.6:(S.fun==='calm'?0.45:1); n=Math.round((n||120)*mult);
  if(!CF){ const c=document.createElement('canvas'); c.id='confetti'; c.setAttribute('aria-hidden','true'); document.body.appendChild(c); CF={c,ctx:c.getContext('2d'),p:[],raf:0}; }
  const W=innerWidth, H=innerHeight; if(CF.c.width!==W||CF.c.height!==H){ CF.c.width=W; CF.c.height=H; }
  let ox=null, oy=null; if(el&&el.getBoundingClientRect){ const r=el.getBoundingClientRect(); ox=r.left+r.width/2; oy=r.top+r.height/2; }
  for(let i=0;i<n;i++){ const burst=ox!=null; const ang=-Math.PI/2+(Math.random()-0.5)*Math.PI*0.9, sp=6+Math.random()*10;
    CF.p.push({x:burst?ox:Math.random()*W, y:burst?oy:-20-Math.random()*H*0.3, vx:burst?Math.cos(ang)*sp:(Math.random()-0.5)*3, vy:burst?Math.sin(ang)*sp:2+Math.random()*4, r:Math.random()*6.28, vr:(Math.random()-0.5)*0.3, w:7+Math.random()*7, h:10+Math.random()*8, c:rnd(CONF), round:Math.random()<0.3, life:0}); }
  if(!CF.raf) CF.raf=requestAnimationFrame(confLoop); }
function confLoop(){ const {ctx,c}=CF; ctx.clearRect(0,0,c.width,c.height);
  CF.p=CF.p.filter(p=>p.y<c.height+40&&p.life<420);
  CF.p.forEach(p=>{ p.life++; p.vy+=0.16; p.vx*=0.99; p.vy*=0.99; p.x+=p.vx+Math.sin(p.life/12)*0.6; p.y+=p.vy; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; if(p.round){ ctx.beginPath(); ctx.arc(0,0,p.w/2,0,6.28); ctx.fill(); } else ctx.fillRect(-p.w/2,-p.h/2*Math.abs(Math.cos(p.life/8)),p.w,p.h*Math.abs(Math.cos(p.life/8))+1); ctx.restore(); });
  if(CF.p.length) CF.raf=requestAnimationFrame(confLoop); else { CF.raf=0; ctx.clearRect(0,0,c.width,c.height); } }
function celebrate(msg,size,el,word){ if(size==='big'){ confetti(170); fanfare(); setTimeout(()=>confetti(90),700); burst(word||rnd(['YES!','TA-DA!','WOO-HOO!','NAILED IT!','BOOM!'])); } else { confetti(70,el); pop(); } Bird.cheer(msg); }

  update(){ if(!this.el) return; this.el.hidden=S.mascot===false; const P=A.P||{}; let m='idle';
    if(this.tmp) m=this.tmp; else if(A.overlay==='party'||A.overlay==='ready'||(A.overlay==='brain'&&Music.playing)) m='dance';

    if(m!==this.mood){ this.mood=m; this.el.className='mascot '+m; } }
};

/* ---- Reset the room ---- */
const RS={on:false,h:null,was:false,t0:0,again:false};
const RSTEPS=[['Stop. Freeze where you are.',5],['Voice 0. Eyes on the board.',5],['Breathe with the circle.',24],['Ready to go again.',0]];
function resetRoom(){ if(RS.on){ endReset(); return; } if(A.attnClose) A.attnClose(); RS.was=Music.playing&&!Music.paused; if(RS.was) Music.pause(); Focus.pause(); chime(1); RS.on=true; RS.t0=Date.now();
  const yc=$('#ytCard'); if(yc) yc.style.visibility='hidden';
  $('#overlayHost').innerHTML='<div class="reset" role="alertdialog" aria-label="Reset the room"><div><div class="eyebrow" style="color:#A9DDF5">Reset the room</div><h1 id="rsTitle">Let’s reset.</h1><ol class="rsteps" id="rsSteps">'+RSTEPS.map(s=>'<li>'+esc(s[0])+'</li>').join('')+'</ol><div class="row" style="margin-top:22px" id="rsBtns"><button class="btn" type="button" data-rs="skip">Skip ahead</button><button class="btn" type="button" data-rs="end" style="background:transparent;color:#fff;border:2px solid rgba(255,255,255,.5)">Back now</button></div></div><div style="display:flex;flex-direction:column;align-items:center;gap:14px"><div class="breathe"><i></i><em id="rsDot"></em><b id="rsTxt">Freeze</b></div><div id="rsLeft" style="font-family:var(--display);font-size:28px"></div></div></div>';
  clearInterval(RS.h); RS.h=setInterval(drawReset,200); drawReset(); Bird.update(); pipRender(true); }
function drawReset(){ if(!RS.on) return; const el=(Date.now()-RS.t0)/1000; let acc=0, cur=RSTEPS.length-1; for(let i=0;i<RSTEPS.length-1;i++){ if(el<acc+RSTEPS[i][1]){ cur=i; break; } acc+=RSTEPS[i][1]; }
  const ul=document.getElementById('rsSteps'); if(!ul) return; [...ul.children].forEach((li,i)=>li.className=i<cur?'done':(i===cur?'cur':''));
  const dot=document.getElementById('rsDot'), tx=document.getElementById('rsTxt'), lf=document.getElementById('rsLeft');
  if(cur===2){ const b=(el-acc)%8; const inh=b<4; tx.textContent=inh?'Breathe in':'Slowly out'; dot.style.transitionDuration='4s'; dot.style.transform=inh?'scale(1)':'scale(.55)'; lf.textContent='Breath '+(Math.floor((el-acc)/8)+1)+' of 3'; }
  else if(cur<2){ tx.textContent=cur===0?'Freeze':'Voice 0'; dot.style.transform='scale(.55)'; lf.textContent=''; }
  if(cur===3&&RS.stage!==3){ RS.stage=3; chime(1); const loud=N.on&&N.lvl>(NOISE_MAX[S.noiseTarget]||4)+1; const P=A.P||{}; const back=A.overlay?'Back to it':(P.block?'Back to '+P.block.name:'Back to it');
    document.getElementById('rsTitle').textContent=loud?'Still a bit noisy.':'That’s better.'; tx.textContent='Ready'; lf.textContent='';
    document.getElementById('rsBtns').innerHTML=(loud?'<button class="btn" type="button" data-rs="again">Reset again</button>':'')+'<button class="btn" type="button" data-rs="end">'+esc(back)+'</button>'; }
  if(cur!==3) RS.stage=cur; }
function endReset(){ clearInterval(RS.h); RS.on=false; RS.stage=0; $('#overlayHost').innerHTML=''; const yc=$('#ytCard'); if(yc) yc.style.visibility=''; if(RS.was) Music.resume(); Focus.resume(); Bird.update(); Bird.say('Great reset. Back to it!'); pipRender(true); }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-rs]'); if(!b) return; const a=b.dataset.rs; if(a==='end') endReset(); else if(a==='skip'){ const el=(Date.now()-RS.t0)/1000; let acc=0; for(let i=0;i<RSTEPS.length-1;i++){ acc+=RSTEPS[i][1]; if(el<acc){ RS.t0-=(acc-el)*1000; break; } } drawReset(); } else if(a==='again'){ endReset(); resetRoom(); } });

const CREW=['Rockets','Comets','Dragons','Pandas','Sharks','Owls','Tigers','Penguins'];
const CREWC=['#FDEFD0','#E3F4EA','#DCEFFB','#FDE3DC','#EFE6FB','#F1F0D6','#FBE3EF','#E6F3F7'];
const CREWD=['#F5B700','#2F8F6B','#2F7FB0','#F2785C','#7C4A99','#9AA02F','#D9558E','#3FA7C9'];
const stationsList=()=>String(S.stations||'').split('\n').map(s=>s.trim()).filter(Boolean).slice(0,8);
function startRotations(){ const st=stationsList(); if(st.length<2){ toast('Add at least 2 stations in Setup › Fun & rotations.'); return; } if(!names().length){ toast('Add your class in Setup first.'); return; }
  if(A.groups.length!==st.length) makeGroups({count:st.length,quiet:true}); clearActivity(); A.rot={round:0,mode:'work',n:st.length}; A.overlay='rotate'; markTools(); rotWork(); }
function rotWork(){ A.rot.mode='work'; MT.start((S.rotMin||12)*60,rotMove); chime(1); Bird.say(A.rot.round?'New station. Go!':'Off you go!'); render(true); }
function rotMove(){ if(A.rot.round>=A.rot.n-1){ A.rot.mode='done'; MT.stop(); render(true); celebrate('Every group did every station!','big'); return; }
  A.rot.mode='move'; chime(2); Music.play('switch'); say('Rotate! Move to your next station.'); Bird.say('Rotate!'); MT.start(45,()=>{ Music.fadeStop(); A.rot.round++; rotWork(); }); render(true); }
function renderRotate(full){ const R=A.rot, st=stationsList(), n=R.n;
  if(full){ const mv=R.mode==='move';
    const cards=st.slice(0,n).map((s,i)=>{ const gi=((i-(mv?R.round+1:R.round))%n+n)%n; const g=A.groups[gi]||[]; return '<div class="station" style="background:'+CREWC[gi%8]+'"><div class="sn">'+esc(s)+'</div><div class="cw"><span class="dot" style="background:'+CREWD[gi%8]+'"></span>'+(mv?'→ ':'')+esc(CREW[gi%8])+'</div><div class="mem">'+esc(g.join(', '))+'</div></div>'; }).join('');
    const head=R.mode==='done'?'<h1 class="big">All done!</h1><p class="lead">Every group visited every station. Back to your seats.</p>':(mv?'<h1 class="big" style="color:var(--coral)">Rotate!</h1><p class="lead">Tidy your station, then move to the one shown with your crew’s name.</p>':'<h1 class="mid" style="color:var(--gum-d)">Round '+(R.round+1)+' of '+n+'</h1>');
    setStage('', '<section class="card"><div class="row" style="justify-content:space-between"><div class="eyebrow">Rotations</div>'+backBtn('Stop rotations')+'</div>'+head+(R.mode==='done'?'':'<div class="stations'+(mv?' moving':'')+'">'+cards+'</div>')+'</section><aside class="side"><section class="card sm" style="align-items:center">'+ringHTML('main',mv?'to move':'at this station','md')+'</section>'+(R.mode==='work'?'<div class="row"><button class="btn coral" type="button" data-act="rotNow">Rotate now</button><button class="btn alt sm" type="button" data-add="120">+2 min</button></div>':'')+(R.mode==='done'?'<button class="btn gold" type="button" data-act="point">+1 class point</button>':'')+'<p class="hint">Crews are made from your class list. Change stations and minutes in Setup › Fun & rotations.</p></aside>'); }
  paintRing('main',MT.remaining(),MT.total,R.mode==='move'?'#F2785C':null); }

/* ---- Focus sounds (made live in the browser) ---- */
const Focus={kind:'',h:null,bus:null,nodes:[],paused:false,
  start(k){ this.stop(); if(!k) return; const a=audio(); if(!a) return; this.kind=k; this.bus=a.createGain(); this.bus.gain.value=0.0001; this.bus.connect(master); this.bus.gain.setTargetAtTime(0.55,a.currentTime,0.8); const B=this.bus, T=(f,t,d,ty,v)=>tone(f,t,d,ty,v,B);
    const noise=(cut,vol)=>{ const len=a.sampleRate*3, b=a.createBuffer(1,len,a.sampleRate), d=b.getChannelData(0); let l=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; l=(l+0.02*w)/1.02; d[i]=l*3.5+w*0.12; } const s=a.createBufferSource(); s.buffer=b; s.loop=true; const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut; const g=a.createGain(); g.gain.value=vol; s.connect(f); f.connect(g); g.connect(B); s.start(); this.nodes.push(s); };
    if(k==='rain'){ noise(2600,0.5); this.h=setInterval(()=>{ if(this.paused) return; const t=a.currentTime; for(let i=0;i<4;i++) T(1400+Math.random()*2600,t+Math.random()*0.4,0.04,'sine',0.012); },350); }
    if(k==='piano'){ const sc=[60,62,64,67,69,72,74,76,79], ch=[[48,55,64],[45,52,60],[41,48,57],[43,50,59]]; let i=0; const mf=m=>440*Math.pow(2,(m-69)/12);
      this.h=setInterval(()=>{ if(this.paused) return; const t=a.currentTime; if(i%8===0) ch[(i/8)%4].forEach(m=>T(mf(m),t,5,'sine',0.045)); if(Math.random()<0.65) T(mf(rnd(sc)),t,2.6,'triangle',0.05); i++; },850); }
    if(k==='birds'){ noise(380,0.22); this.h=setInterval(()=>{ if(this.paused) return; const t=a.currentTime, r=Math.random();
      if(r<0.25){ T(2650,t,0.5,'sine',0.05); T(5300,t,0.25,'sine',0.012); }
      else if(r<0.5){ const f0=2200+Math.random()*1800; for(let j=0;j<3;j++){ const o=T(f0,t+j*0.11,0.08,'sine',0.035); o.frequency.exponentialRampToValueAtTime(f0*1.35,t+j*0.11+0.07); } }
      else if(r<0.58){ const o=T(900,t,0.5,'triangle',0.04); o.frequency.exponentialRampToValueAtTime(1500,t+0.45); } },700); } },
  pause(){ if(this.bus&&AC){ this.paused=true; this.bus.gain.setTargetAtTime(0.0001,AC.currentTime,0.08); } },
  resume(){ if(this.bus&&AC&&this.paused){ this.paused=false; this.bus.gain.setTargetAtTime(0.55,AC.currentTime,0.4); } },
  stop(){ clearInterval(this.h); this.h=null; this.nodes.forEach(n=>{ try{ n.stop(AC.currentTime+1.2); }catch(e){} }); this.nodes=[]; if(this.bus&&AC){ const b=this.bus; b.gain.setTargetAtTime(0.0001,AC.currentTime,0.3); setTimeout(()=>{ try{ b.disconnect(); }catch(e){} },1600); } this.bus=null; this.kind=''; this.paused=false; }
};

function fitApp(){ const a=document.getElementById('app'); if(!a) return;
  if(innerWidth<600){ a.style.zoom=''; a.style.width=''; a.style.height=''; document.body.classList.remove('fitted'); return; }
  const cs=getComputedStyle(document.body), pw=innerWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight); const z=Math.min(pw/1408,innerHeight/860); a.style.zoom=z; a.style.width=(pw/z)+'px'; a.style.height=(innerHeight/z)+'px'; document.body.classList.add('fitted'); fitCards(); }
function fitBox(box,lo){ lo=lo||0.55; const kids=[...box.children]; kids.forEach(k=>k.style.zoom=''); if(box.scrollHeight<=box.clientHeight) return; let f=1;
  for(let i=0;i<4&&box.scrollHeight>box.clientHeight&&f>lo;i++){ f=Math.max(lo,f*Math.min(0.97,(box.clientHeight-6)/box.scrollHeight)); kids.forEach(k=>k.style.zoom=f); } }
function fitCards(){ if(innerWidth<600) return; document.querySelectorAll('#stage .card').forEach(b=>fitBox(b)); const st=document.getElementById('strip'); if(st) fitBox(st,0.4); document.querySelectorAll('.sheet').forEach(b=>fitBox(b,0.66)); }
let fitQ=0; const fitSoon=()=>{ cancelAnimationFrame(fitQ); fitQ=requestAnimationFrame(()=>requestAnimationFrame(fitCards)); };
addEventListener('resize',()=>{ fitApp(); }); setInterval(()=>{ const st=document.getElementById('strip'); if(st&&st.scrollHeight>st.clientHeight+2) fitCards(); },2000);

const TK={exit:{name:'Exit ticket',list:EXITS,pre:'x',hand:'Answer on a sticky note or in your book, then hand it in on your way out.'},entry:{name:'Entry ticket',list:ENTRIES,pre:'e',hand:'Answer on a sticky note or in your book while everyone settles.'}};
function ticketsOf(kind,all){ const base=TK[kind].list.map((x,i)=>({id:TK[kind].pre+i,t:x[0],b:x[1],l:x[2]||null})); const mine=(S.myTickets||[]).filter(m=>m.kind===kind).map(m=>({id:m.id,t:m.t,b:m.b,l:null,mine:true})); const L=mine.concat(base); return all?L:L.filter(x=>!(S.ticketOff||[]).includes(x.id)); }
const ticketById=id=>ticketsOf('exit',true).concat(ticketsOf('entry',true)).find(x=>x.id===id);
function pickTicket(kind){ let pool=ticketsOf(kind); if(!pool.length) pool=ticketsOf(kind,true); S.ticketUsed=S.ticketUsed||{}; let used=(S.ticketUsed[kind]||[]).filter(id=>pool.some(x=>x.id===id)); if(used.length>=pool.length) used=[]; const free=pool.filter(x=>!used.includes(x.id)); const k=rnd(free).id; used.push(k); S.ticketUsed[kind]=used; save(); return k; }
function ticketNo(){ S.ticketNo=((S.ticketNo||0)%99)+1; save(); return S.ticketNo; }
/* sounds */

function tick1(){ if(!sfxOK()) return; tone(1300,AC.currentTime,0.05,'square',0.03); }
function whirr(sec){ if(!sfxOK()) return; const t=AC.currentTime, o=AC.createOscillator(), f=AC.createBiquadFilter(), g=AC.createGain(), lfo=AC.createOscillator(), lg=AC.createGain(); o.type='sawtooth'; o.frequency.value=58; f.type='lowpass'; f.frequency.value=420; lfo.frequency.value=14; lg.gain.value=0.035; lfo.connect(lg); lg.connect(g.gain); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.07,t+0.08); g.gain.setValueAtTime(0.07,t+sec-0.1); g.gain.exponentialRampToValueAtTime(0.0001,t+sec); o.connect(f); f.connect(g); g.connect(master); o.start(t); lfo.start(t); o.stop(t+sec+0.05); lfo.stop(t+sec+0.05); }
function ding(){ if(!sfxOK()) return; const t=AC.currentTime; tone(1760,t,0.9,'sine',0.16); tone(2637,t,0.5,'sine',0.05); }

function exitState(P){ if(P&&(P.phase==='exit'||P.phase==='entry')){ const key=P.block.id+'|'+P.phase; if(!A.xp||A.xp.key!==key) A.xp={key,kind:P.phase,id:((P.phase==='exit'?P.block.exitT:P.block.entryT)&&ticketById(P.phase==='exit'?P.block.exitT:P.block.entryT)?(P.phase==='exit'?P.block.exitT:P.block.entryT):pickTicket(P.phase)),no:ticketNo(),mode:'print'}; return A.xp; } return A.xo; }

    if(st.mode==='print') runPrint(st); }

function runPrint(st){ const tok=st.tok=Math.random(); const led=document.getElementById('tmLed'), btn=document.getElementById('tmBtn'); let n=0;
  setTimeout(()=>{ if(st.tok!==tok) return; if(btn) btn.classList.add('press'); blip();

  setStage('one','<section class="card"><div class="row" style="justify-content:space-between"><h1 class="mid" style="color:var(--gum-d)">Choose a ticket</h1><div class="row"><button class="btn gold" type="button" data-tuse="">Surprise me</button>'+backBtn()+'</div></div><div class="row"><button class="tab" type="button" data-tkind="entry" aria-selected="'+(tp.kind==='entry')+'">Entry tickets</button><button class="tab" type="button" data-tkind="exit" aria-selected="'+(tp.kind==='exit')+'">Exit tickets</button><span class="hint" style="margin-left:auto">Untick any you don’t want in the surprise mix.</span></div><div class="tgrid">'+L.map(x=>'<div class="tcard'+(off.includes(x.id)?' off':'')+'"><b>'+esc(x.t)+'</b><span>'+esc(x.b)+(x.l?' '+esc(x.l.join(' · ')):'')+'</span><div class="row" style="margin-top:auto;justify-content:space-between"><label class="chk" style="font-size:14px"><input type="checkbox" data-toff="'+x.id+'" '+(off.includes(x.id)?'':'checked')+'> In the mix</label><span class="row" style="gap:6px">'+(x.mine?'<button class="btn alt sm" type="button" data-tdel="'+x.id+'" aria-label="Delete">✕</button>':'')+'<button class="btn sm" type="button" data-tuse="'+x.id+'">Use</button></span></div></div>').join('')+'<div class="tcard add">'+(tp.form?'<input type="text" id="tNewT" placeholder="Title, e.g. Summary in a tweet" maxlength="40"><textarea id="tNewB" placeholder="What students do" style="min-height:80px" maxlength="200"></textarea><div class="row"><button class="btn sm" type="button" data-act="tAddSave">Add ticket</button><button class="btn alt sm" type="button" data-act="tAddCancel">Cancel</button></div>':'<button class="btn alt" type="button" data-act="tAdd" style="margin:auto">+ Write your own</button>')+'</div></div></section>'); }
function useTicket(id){ const tp=A.tp; const kind=tp.kind; const pick=id||pickTicket(kind);
  if(tp.live&&A.P&&(A.P.phase===kind)){ const st=exitState(A.P); st.id=pick; st.no=ticketNo(); st.mode='print'; A.overlay=null; markTools(); A.phaseKey=phaseSig(A.P); render(true); return; }
  MT.stop(); A.xo={kind,id:pick,no:ticketNo(),mode:'print'}; A.overlay='ticket'; markTools(); MT.start(EXIT_MIN*60,()=>chime(1)); render(true); }
document.addEventListener('click',e=>{ const t=e.target.closest('[data-tuse],[data-tkind],[data-tdel],[data-bpick],[data-bkind]'); if(!t||t.closest('#sheetHost')) return;
  if(t.dataset.tuse!==undefined) return useTicket(t.dataset.tuse);
  if(t.dataset.tkind){ A.tp.kind=t.dataset.tkind; A.tp.form=false; render(true); return; }
  if(t.dataset.tdel){ S.myTickets=(S.myTickets||[]).filter(m=>m.id!==t.dataset.tdel); save(); render(true); return; }
  if(t.dataset.bpick!==undefined) return startBrain(null,t.dataset.bpick||null);
});
document.addEventListener('change',e=>{ const el=e.target; if(el.dataset&&el.dataset.toff){ const off=new Set(S.ticketOff||[]); el.checked?off.delete(el.dataset.toff):off.add(el.dataset.toff); S.ticketOff=[...off]; save(); const c=el.closest('.tcard'); if(c) c.classList.toggle('off',!el.checked); }
  if(el.dataset&&el.dataset.boff){ const off=new Set(S.breakOff||[]); el.checked?off.delete(el.dataset.boff):off.add(el.dataset.boff); S.breakOff=[...off]; save(); const c=el.closest('.tcard'); if(c) c.classList.toggle('off',!el.checked); } });
function ticketAct(a){ if(a==='tChoose'){ const P=A.P; openTicketPicker(A.overlay==='ticket'?A.xo.kind:(P&&(P.phase==='entry'||P.phase==='exit')?P.phase:'exit'), A.overlay!=='ticket'); return true; }
  if(a==='tAdd'){ A.tp.form=true; render(true); const i=document.getElementById('tNewT'); if(i) i.focus(); return true; }
  if(a==='tAddCancel'){ A.tp.form=false; render(true); return true; }
  if(a==='tAddSave'){ const t=(document.getElementById('tNewT')||{}).value||'', b=(document.getElementById('tNewB')||{}).value||''; if(!t.trim()||!b.trim()){ toast('Add a title and what students do.'); return true; } S.myTickets=(S.myTickets||[]).concat([{id:'m'+uid(),kind:A.tp.kind,t:t.trim(),b:b.trim()}]); save(); A.tp.form=false; render(true); toast('Ticket added. It’s in the mix now.'); return true; }
  return false; }

 {id:'fist',name:'Fist to five',blurb:'Show how well you understand, then plan your next step.',steps:[

function startReflect(id){ const off=S.reflectOff||[]; let pool=REFLECT.filter(r=>!off.includes(r.id)); if(!pool.length) pool=REFLECT; const r=(id&&REFLECT.find(x=>x.id===id))||rnd(pool); clearActivity(); A.rf={id:r.id,i:0}; A.overlay='reflect'; markTools(); rfStep(); }
function rfStep(){ const r=REFLECT.find(x=>x.id===A.rf.id), st=r.steps[A.rf.i]; chime(1); MT.start(st[2],()=>{ if(A.rf.i<r.steps.length-1){ A.rf.i++; rfStep(); } else { A.rf.done=true; MT.stop(); render(true); celebrate('Nice reflecting!','small'); } }); if(A.rf.i===0) Bird.say('Reflection time!'); render(true); }
function renderReflect(full){ const R=A.rf, r=REFLECT.find(x=>x.id===R.id), st=r.steps[R.i];
  if(full){ setStage('', '<section class="card"><div class="row" style="justify-content:space-between"><div class="eyebrow">Quick reflection · '+esc(r.name)+'</div><div class="row"><button class="btn alt sm" type="button" data-act="rfMenu">All reflections</button>'+backBtn('Stop')+'</div></div>'+(R.done?'<h1 class="big">Nice reflecting!</h1><p class="lead">Thinking about your learning helps it stick.</p>':'<h1 class="big">'+esc(st[0])+'</h1>'+(st[1]?'<p class="lead" style="font-size:clamp(22px,2.2vw,32px);color:var(--ink)">'+esc(st[1])+'</p>':''))+'<div class="rfdots">'+r.steps.map((_,i)=>'<i class="'+(R.done||i<R.i?'done':i===R.i?'cur':'')+'"></i>').join('')+'</div></section><aside class="side"><section class="card sm" style="align-items:center">'+(R.done?'<div class="bigbird" style="width:190px">'+birdSVG()+'</div>':ringHTML('main','this step','md'))+'</section><div class="row">'+(R.done?'<button class="btn gold" type="button" data-act="point">+1 class point</button><button class="btn alt" type="button" data-act="rfAgain">Another one</button>':'<button class="btn" type="button" data-act="rfNext">Next</button>'+(R.i>0?'<button class="btn alt" type="button" data-act="rfBack">Back</button>':''))+'</div></aside>'); }
  if(!R.done) paintRing('main',MT.remaining(),MT.total); }
function reflectAct(a){ if(a==='rfNext'){ const r=REFLECT.find(x=>x.id===A.rf.id); if(A.rf.i<r.steps.length-1){ A.rf.i++; rfStep(); } else { MT.stop(); A.rf.done=true; render(true); celebrate('Nice reflecting!','small'); } return true; }
  if(a==='rfBack'){ if(A.rf.i>0){ A.rf.i--; rfStep(); } return true; }
  if(a==='rfAgain'){ startReflect(null); return true; }
  if(a==='rfMenu'){ MT.stop(); A.rf=null; openOverlay('rpick'); return true; }
  return false; }
document.addEventListener('click',e=>{ const t=e.target.closest('[data-rfstart]'); if(t&&!t.closest('#sheetHost')) startReflect(t.dataset.rfstart||null); });
document.addEventListener('change',e=>{ const el=e.target; if(el.dataset&&el.dataset.rfoff){ const off=new Set(S.reflectOff||[]); el.checked?off.delete(el.dataset.rfoff):off.add(el.dataset.rfoff); S.reflectOff=[...off]; save(); const c=el.closest('.tcard'); if(c) c.classList.toggle('off',!el.checked); } });

function renderReflectPicker(){ const off=S.reflectOff||[];
  setStage('one','<section class="card"><div class="row" style="justify-content:space-between"><h1 class="mid" style="color:var(--gum-d)">Quick reflections</h1><div class="row"><button class="btn gold" type="button" data-rfstart="">Surprise me</button>'+backBtn()+'</div></div><div class="row"><span class="hint">Whole class, 1 to 2 minutes, no writing. Roomie runs each step.</span></div><div class="tgrid">'+REFLECT.map(r=>{ const secs=r.steps.reduce((a,s)=>a+s[2],0); return '<div class="tcard'+(off.includes(r.id)?' off':'')+'"><span class="chip" style="align-self:flex-start;font-size:13px;padding:3px 10px">'+r.steps.length+' steps · '+(Math.round(secs/30)/2)+' min</span><b>'+esc(r.name)+'</b><span>'+esc(r.blurb)+'</span><div class="row" style="margin-top:auto;justify-content:space-between"><label class="chk" style="font-size:14px"><input type="checkbox" data-rfoff="'+r.id+'" '+(off.includes(r.id)?'':'checked')+'> In the mix</label><button class="btn sm" type="button" data-rfstart="'+r.id+'">Start</button></div></div>'; }).join('')+'</div></section>'); }

/* ---- Visible thinking routines (after Harvard Project Zero; our own wording) ---- */
const THINK=[
 {id:'stw',name:'See, Think, Wonder',when:'Start of a topic',blurb:'Look closely at an image, object or text before you explain anything.',steps:[
   ['See','What do you notice? Only what you can actually see.','I see…',90],
   ['Think','What do you think is going on?','I think… because…',90],
   ['Wonder','What questions does it raise?','I wonder…',90]]},
 {id:'wmys',name:'What makes you say that?',when:'Any time',blurb:'Push past the first answer. Every idea needs evidence.',steps:[
   ['What’s going on?','Look closely. What do you think is happening here?','I think…',90],
   ['What makes you say that?','Point to the evidence.','I say that because…',90],
   ['What more can we find?','What else could we look at to check?','I’d like to find out…',60]]},
 {id:'tpe',name:'Think, Puzzle, Explore',when:'Start of a topic',blurb:'Find out what students already know and what they want to dig into.',steps:[

 {id:'csq',name:'Claim, Support, Question',when:'During learning',blurb:'Make a claim, back it up, then test it.',steps:[

   ['Question','What would make you question your claim?','But what about…',90]]},
 {id:'cec',name:'Connect, Extend, Challenge',when:'After new learning',blurb:'Link new ideas to what you already knew.',steps:[

 {id:'used',name:'I used to think… Now I think…',when:'End of a unit',blurb:'Notice how your thinking has changed.',steps:[

const thinkR=id=>THINK.find(x=>x.id===id);
function startThink(id){ const off=S.thinkOff||[]; let pool=THINK.filter(r=>!off.includes(r.id)); if(!pool.length) pool=THINK; const r=(id&&thinkR(id))||rnd(pool); clearActivity(); A.th={id:r.id,i:0}; A.overlay='think'; markTools(); thStep(); Bird.say('Thinking caps on!'); }
function thStep(){ const st=thinkR(A.th.id).steps[A.th.i]; A.th.up=false; chime(1); MT.start(st[3],()=>{ A.th.up=true; chime(2); Bird.say('Time! Ready for the next step?'); render(true); }); render(true); }
function thNext(){ const r=thinkR(A.th.id); if(A.th.i<r.steps.length-1){ A.th.i++; thStep(); } else { MT.stop(); A.th.done=true; render(true); celebrate('Great thinking!','small'); } }
function renderThink(full){ const R=A.th, r=thinkR(R.id), st=r.steps[R.i], f=(S.thinkFocus||'').trim();
  if(full){ const chart='<div class="thchart">'+r.steps.map((s,i)=>'<div class="thbox '+(R.done||i<R.i?'done':i===R.i?'cur':'')+'"><b>'+esc(s[0])+'</b>'+(s[2]?'<span>'+esc(s[2])+'</span>':'')+'</div>').join('')+'</div>';
    setStage('', '<section class="card"><div class="row" style="justify-content:space-between"><div class="eyebrow">Thinking routine · '+esc(r.name)+'</div><div class="row"><button class="btn alt sm" type="button" data-act="thMenu">All routines</button>'+backBtn('Stop')+'</div></div>'+(f?'<div class="thfocus"><small>We’re thinking about</small>'+esc(f)+'</div>':'')+(R.done?'<h1 class="big">Great thinking!</h1><p class="lead">Your thinking is on the wall now. Keep it there and come back to it.</p>':'<h1 class="big">'+esc(st[0])+'</h1><p class="lead" style="font-size:clamp(22px,2.2vw,32px);color:var(--ink)">'+esc(st[1])+'</p>'+(st[2]?'<div class="thstem">'+esc(st[2])+'</div>':''))+chart+'</section><aside class="side"><section class="card sm" style="align-items:center">'+(R.done?'<div class="bigbird" style="width:190px">'+birdSVG()+'</div>':ringHTML('main',R.up?'time’s up':'thinking time','md'))+(R.done?'':'<div class="row" style="justify-content:center"><button class="btn alt sm" type="button" data-act="thPause">'+(MT.running?'Pause':'Resume')+'</button><button class="btn alt sm" type="button" data-act="thMore">+1 min</button></div>')+'</section><div class="row">'+(R.done?'<button class="btn gold" type="button" data-act="point">+1 class point</button><button class="btn alt" type="button" data-act="thMenu">Another routine</button>':'<button class="btn" type="button" data-act="thNext">'+(R.i<r.steps.length-1?'Next step':'Finish')+'</button>'+(R.i>0?'<button class="btn alt" type="button" data-act="thBack">Back</button>':''))+'</div></aside>'); }
  if(!R.done) paintRing('main',MT.remaining(),MT.total); }
function thinkAct(a){ if(!A.th&&a!=='thMenu') return false;
  if(a==='thNext'){ thNext(); return true; }
  if(a==='thBack'){ if(A.th.i>0){ A.th.i--; thStep(); } return true; }
  if(a==='thPause'){ MT.running?MT.pause():MT.resume(); render(true); return true; }
  if(a==='thMore'){ MT.add(60); if(A.th.up){ A.th.up=false; MT.onDone=()=>{ A.th.up=true; chime(2); render(true); }; MT.resume(); } render(true); return true; }
  if(a==='thMenu'){ MT.stop(); A.th=null; openOverlay('thpick'); return true; }
  return false; }

/* Quiz games: teacher asks the questions out loud, Roomie keeps the board */
const QGAMES=[
 {id:'drop',name:'Drop Four',blurb:'Right answer? Your team drops a counter. First to four in a row wins.',teams:[2,4]},
 {id:'stars',name:'Mystery Stars',blurb:'Right answer? Grab a star. Some are worth a lot, some cost points. Nobody knows until the reveal!',teams:[2,4]},
 {id:'float',name:'Stay Afloat',blurb:'Two teams. Right answer? Sink a player from the other team or rescue one of yours. Wrong? Lose one.',teams:[2,2]}];
function renderQuizPick(){ const n=S.qTeams||2;
  setStage('one','<section class="card"><div class="row" style="justify-content:space-between"><h1 class="mid" style="color:var(--gum-d)">Quiz games</h1>'+backBtn()+'</div><p class="hint" style="margin:0">Use your own revision questions. Ask them out loud; Roomie keeps the board and the score.</p><div class="row"><span class="hint">Teams:</span>'+[2,3,4].map(k=>'<button class="btn sm '+(k===n?'':'alt')+'" type="button" data-g="qteams" data-v="'+k+'">'+k+'</button>').join('')+'</div><div class="tgrid">'+QGAMES.map(g=>'<div class="tcard"><span class="chip" style="align-self:flex-start;font-size:13px;padding:3px 10px">'+(g.teams[1]===2?'2 teams':n+' teams')+'</span><b>'+esc(g.name)+'</b><span>'+esc(g.blurb)+'</span><div class="row" style="margin-top:auto;justify-content:flex-end"><button class="btn sm" type="button" data-g="qstart" data-v="'+g.id+'">Start</button></div></div>').join('')+'</div></section>'); }
function startQuiz(id){ const n=id==='float'?2:(S.qTeams||2); const Q={id,n,cur:0,win:-1};
  if(id==='drop') Q.cells=Array.from({length:6},()=>Array(7).fill(-1));
  if(id==='stars'){ const vals=[5,4,3,3,2,2,2,1,1,1,1,2,3,-1,-1,-2,-2,4,1,-3]; Q.stars=vals.sort(()=>Math.random()-.5).map(v=>({v,o:-1})); Q.shown=false; }
  if(id==='float'){ Q.size=S.qSize||10; Q.left=[Q.size,Q.size]; }
  A.qz=Q; render(true); Bird.say('Game on!'); }
function dropWin(C,r,c,t){ const D=[[0,1],[1,0],[1,1],[1,-1]]; return D.some(([dr,dc])=>{ let k=1; for(const s of [1,-1]){ let rr=r+dr*s,cc=c+dc*s; while(rr>=0&&rr<6&&cc>=0&&cc<7&&C[rr][cc]===t){ k++; rr+=dr*s; cc+=dc*s; } } return k>=4; }); }
function renderQuiz(full){ if(!full) return; const Q=A.qz; if(!Q) return renderQuizPick(); const g=QGAMES.find(x=>x.id===Q.id);
  const teams='<div class="row tchips">'+Array.from({length:Q.n},(_,i)=>tChip(i,i===Q.cur)).join('')+'</div>';
  const head='<div class="row" style="justify-content:space-between"><div class="eyebrow">Quiz game · '+esc(g.name)+'</div><div class="row"><button class="btn alt sm" type="button" data-g="qmenu">All games</button>'+backBtn('Stop')+'</div></div>';
  let board='', side='';
  if(Q.id==='drop'){ board='<div class="dropb">'+Q.cells.map((row,r)=>row.map((v,c)=>'<button type="button" class="dc" data-g="drop" data-v="'+c+'" aria-label="Column '+(c+1)+'"'+(v>=0?' style="--tc:'+TEAMC[v][1]+'"':'')+'><i class="'+(v>=0?'on':'')+'"></i></button>').join('')).join('')+'</div>';
    side=Q.win>=0?'<h2 class="mid">'+esc(TEAMC[Q.win][0])+' win!</h2>':'<p class="lead" style="margin:0">Ask a question. Tap the team that got it right, then tap a column.</p>'; }
  if(Q.id==='stars'){ board='<div class="starb">'+Q.stars.map((s,i)=>'<button type="button" class="st'+(s.o>=0?' got':'')+(Q.shown?' shown':'')+'" data-g="star" data-v="'+i+'"'+(s.o>=0?' style="--tc:'+TEAMC[s.o][1]+'"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg><b>'+(Q.shown?(s.v>0?'+':'')+s.v:i+1)+'</b></button>').join('')+'</div>';
    const tot=Array.from({length:Q.n},(_,t)=>Q.stars.filter(s=>s.o===t).reduce((a,s)=>a+s.v,0)), got=Array.from({length:Q.n},(_,t)=>Q.stars.filter(s=>s.o===t).length);
    side=(Q.shown?'<div class="qscore">'+tot.map((v,t)=>'<div style="--tc:'+TEAMC[t][1]+'"><i></i>'+esc(TEAMC[t][0])+' <b>'+v+'</b></div>').join('')+'</div>':'<p class="lead" style="margin:0">Right answer? Tap the team, then the star they choose.</p><div class="qscore">'+got.map((v,t)=>'<div style="--tc:'+TEAMC[t][1]+'"><i></i>'+esc(TEAMC[t][0])+' <b>'+v+' ★</b></div>').join('')+'</div><button class="btn gold" type="button" data-g="sreveal">Reveal the points!</button>'); }
  if(Q.id==='float'){ board='<div class="floatb">'+[0,1].map(t=>'<div class="fteam" style="--tc:'+TEAMC[t][1]+'"><b>'+esc(TEAMC[t][0])+'</b><div class="fdots">'+Array.from({length:Q.size},(_,k)=>'<i class="'+(k<Q.left[t]?'on':'')+'"></i>').join('')+'</div><span>'+Q.left[t]+' afloat</span>'+(Q.win<0?'<div class="row"><button class="btn sm" type="button" data-g="fl" data-v="'+t+':sink">Right! Sink one of theirs</button><button class="btn alt sm" type="button" data-g="fl" data-v="'+t+':save">Right! Rescue one</button><button class="btn alt sm" type="button" data-g="fl" data-v="'+t+':lose">Wrong: lose one</button></div>':'')+'</div>').join('')+'</div>';
    side=Q.win>=0?'<h2 class="mid">'+esc(TEAMC[Q.win][0])+' stay afloat!</h2>':'<p class="lead" style="margin:0">Teams take turns answering. Sunk players sit down. Last team with players wins.</p><div class="row"><span class="hint">Players per team</span><button class="btn alt sm" type="button" data-g="fsize" data-v="-1">−</button><b>'+Q.size+'</b><button class="btn alt sm" type="button" data-g="fsize" data-v="1">+</button></div>'; }
  setStage('', '<section class="card">'+head+board+'</section><aside class="side"><section class="card sm">'+(Q.id==='float'?'':teams)+side+(Q.win>=0||Q.shown?'<button class="btn" type="button" data-g="qagain">Play again</button>':'')+'</section></aside>'); }
function quizWin(t,word){ A.qz.win=t; render(true); celebrate(TEAMC[t][0]+' win!','big',null,word||'WINNERS!'); }

document.addEventListener('click',e=>{ const t=e.target.closest('[data-g]'); if(!t||t.closest('#sheetHost')) return; const g=t.dataset.g, v=t.dataset.v; audio();
  if(g==='tables'){ S.tables=Math.max(1,Math.min(12,(S.tables||6)+(+v))); save(); render(true); return; }
  if(g==='pkgo'){ const i=+v, P=A.pk; if(P.out.includes(i)) return; P.out.push(i); P.call='Table '+(i+1)+', off you go!'; chime(1); Bird.say(P.out.length===1?'First ready, first out!':'Off you go!'); render(true); return; }
  if(g==='pkall'){ A.pk.call='Everyone else, off you go. See you next time!'; chime(2); celebrate('Great pack up!','small'); render(true); return; }
  if(g==='ftick'){ const F=A.fin, i=+v; F.ticks=F.ticks.includes(i)?F.ticks.filter(x=>x!==i):F.ticks.concat(i); pop(); if(F.ticks.length===4) celebrate('Now choose a task!','small'); render(true); return; }
  if(g==='fpick'){ const L=S.finishList||FIN_DEF; A.fin.pick=Math.floor(Math.random()*L.length); A.fin.edit=false; blip(); render(true); return; }
  if(g==='fedit'){ A.fin.edit=!A.fin.edit; render(true); return; }
  if(g==='fsave'){ const L=((document.getElementById('finTxt')||{}).value||'').split('\n').map(s=>s.trim()).filter(Boolean); S.finishList=L.length?L:FIN_DEF; save(); A.fin.edit=false; A.fin.pick=-1; render(true); toast('Early-finisher list saved.'); return; }
  if(g==='qteams'){ S.qTeams=+v; save(); render(true); return; }
  if(g==='qstart'){ startQuiz(v); return; }
  if(g==='qmenu'){ A.qz=null; render(true); return; }
  if(g==='qagain'){ startQuiz(A.qz.id); return; }
  const Q=A.qz; if(!Q) return;
  if(g==='team'){ Q.cur=+v; blip(); render(true); return; }
  if(g==='drop'&&Q.win<0){ const c=+v; let r=5; while(r>=0&&Q.cells[r][c]>=0) r--; if(r<0){ toast('That column is full.'); return; } Q.cells[r][c]=Q.cur; pop(); if(dropWin(Q.cells,r,c,Q.cur)) return quizWin(Q.cur,'FOUR!'); if(Q.cells.every(row=>row.every(x=>x>=0))){ Q.win=-1; toast('Board full! Play again.'); } render(true); return; }
  if(g==='star'&&!Q.shown){ const s=Q.stars[+v]; s.o=s.o===Q.cur?-1:Q.cur; pop(); render(true); return; }
  if(g==='sreveal'){ Q.shown=true; drumroll(1.3); const tot=Array.from({length:Q.n},(_,t)=>Q.stars.filter(s=>s.o===t).reduce((a,s)=>a+s.v,0)); const best=Math.max(...tot), w=tot.indexOf(best); render(true); setTimeout(()=>{ if(tot.filter(x=>x===best).length>1){ celebrate('It’s a tie!','big',null,'TIE!'); } else celebrate(TEAMC[w][0]+' win!','big',null,'WINNERS!'); },1400); return; }
  if(g==='fsize'){ Q.size=S.qSize=Math.max(3,Math.min(20,Q.size+(+v))); save(); Q.left=[Q.size,Q.size]; render(true); return; }
  if(g==='fl'&&Q.win<0){ const [ts,how]=v.split(':'), tm=+ts, other=1-tm; if(how==='sink') Q.left[other]=Math.max(0,Q.left[other]-1); if(how==='save') Q.left[tm]=Math.min(Q.size,Q.left[tm]+1); if(how==='lose') Q.left[tm]=Math.max(0,Q.left[tm]-1); pop(); const z=Q.left.indexOf(0); if(z>=0) return quizWin(1-z,'AFLOAT!'); render(true); return; }
});

/* ---- v0.6: planned activities inside a lesson (brain break, thinking routine, reflection, quiz) ---- */
const CUE_AT=[5,10,15,20,25,30,35,40,45,50,55];
function lessonBase(P){ const b=P.block, R0=b.startR&&!A.skipStart[b.id]?routineById(b.startR):null; return P.st+(R0?R0.minutes:0)+(b.entry?EXIT_MIN:0); }
function cuesOf(P){ const b=P&&P.block; if(!b||b.kind!=='lesson') return []; const base=lessonBase(P), out=[];
  const end=P.xs!=null?P.xs:P.en, len=w=>w.startsWith('quiz')?10:w.startsWith('think')?6:3;
  const when=(v,w)=>v==='start'?base:v==='end'?Math.max(base,end-len(w)):base+(+v);
  if(b.bbAt){ const w='brain:'+(b.bbId||'any'); out.push({key:b.id+'|bb',at:when(b.bbAt,w),w}); }
  if(b.acAt){ const w=b.acW||'think:any'; out.push({key:b.id+'|ac',at:when(b.acAt,w),w}); }
  return out.filter(c=>c.at<end).sort((a,c)=>a.at-c.at); }
function cueLabel(w){ const [k,id]=w.split(':');
  if(k==='brain'){ const b=id!=='any'&&BREAKS.find(x=>x.id===id); return 'Brain break'+(b?' · '+b.name:''); }
  if(k==='think'){ const r=id!=='any'&&thinkR(id); return 'Thinking routine'+(r?' · '+r.name:''); }
  if(k==='reflect'){ const r=id!=='any'&&REFLECT.find(x=>x.id===id); return 'Quick reflection'+(r?' · '+r.name:''); }
  if(k==='checkin') return 'Feelings check-in';
  return 'Quiz game'; }
function runCue(w){ const [k,id]=w.split(':'), one=id&&id!=='any'?id:null; A.nudge=null; hideNudge();
  if(k==='brain') return startBrain(null,one); if(k==='think') return startThink(one); if(k==='reflect') return startReflect(one); if(k==='checkin'){ A.ciView=false; return openOverlay('checkin'); } A.qz=null; openOverlay('quiz'); }
A.cueDone={}; A.cueSnooze={};
function checkCues(){ const P=A.P; if(!P||P.phase!=='lesson'){ if(A.nudge){ A.nudge=null; hideNudge(); } return; }
  const due=cuesOf(P).find(c=>!A.cueDone[c.key]&&P.mins>=(A.cueSnooze[c.key]||c.at));
  if(!due||A.overlay||(A.nudge&&A.nudge.key===due.key)) { if(A.nudge&&A.nudge.auto&&!A.overlay){ const left=Math.ceil((A.nudge.auto-Date.now())/1000); const el=document.getElementById('nuCount'); if(el) el.textContent=left>0?'Starting in '+left+'…':''; if(left<=0){ A.cueDone[A.nudge.key]=true; runCue(A.nudge.w); } } return; }
  A.nudge={key:due.key,w:due.w,auto:S.autoStart?Date.now()+15000:0}; showNudge(); chime(1); Bird.say('It’s time for something fun!'); }
function showNudge(){ let n=document.getElementById('nudge'); if(!n){ n=document.createElement('div'); n.id='nudge'; n.className='nudge'; n.setAttribute('role','status'); document.body.appendChild(n); }
  n.innerHTML='<small>Planned for now</small><b>'+esc(cueLabel(A.nudge.w))+'</b><span id="nuCount" class="hint"></span><div class="row"><button class="btn sm" type="button" data-nu="go">Start now</button><button class="btn alt sm" type="button" data-nu="later">In 5 min</button><button class="btn alt sm" type="button" data-nu="skip">Skip</button></div>'; n.hidden=false; }
function hideNudge(){ const n=document.getElementById('nudge'); if(n) n.hidden=true; }
document.addEventListener('click',e=>{ const t=e.target.closest('[data-nu]'); if(!t||!A.nudge) return; audio(); const N=A.nudge, a=t.dataset.nu;
  if(a==='go'){ A.cueDone[N.key]=true; runCue(N.w); }
  if(a==='later'){ A.cueSnooze[N.key]=A.P.mins+5; A.nudge=null; hideNudge(); toast('Okay, I’ll remind you in 5 minutes.'); }
  if(a==='skip'){ A.cueDone[N.key]=true; A.nudge=null; hideNudge(); } });
setInterval(checkCues,1000);
/* planner options for the Day plan */
function planExtrasHTML(b){ if(b.kind!=='lesson') return '';
  const tk=(kind,cur,on)=>opt('none','No ticket',on?'':'none')+opt('','Surprise me',on?cur:'x')+ticketsOf(kind,true).map(t=>opt(t.id,t.t,cur)).join('');

/* ---- v0.8.2: tap a subject in the day list ---- */
function segInfo(x){ const b=x.b, L=[]; if(b.materials) L.push('Get out: '+b.materials); if(S.expect[b.exp]) L.push('Expectations: '+S.expect[b.exp].name);
  const R0=b.startR&&routineById(b.startR), R1=b.endR&&routineById(b.endR); if(R0) L.push('Starts with: '+R0.name); if(b.kind==='lesson'){ if(b.entry) L.push('Entry ticket'+(b.entryT&&ticketById(b.entryT)?': '+ticketById(b.entryT).t:'')); const at=v=>v==='start'?'at the start':v==='end'?'at the end':'after '+v+' min'; if(b.bbAt) L.push(cueLabel('brain:'+(b.bbId||'any'))+' '+at(b.bbAt)); if(b.acAt) L.push(cueLabel(b.acW||'think:any')+' '+at(b.acAt)); if(b.exit) L.push('Exit ticket'+(b.exitT&&ticketById(b.exitT)?': '+ticketById(b.exitT).t:'')); } if(R1) L.push('Ends with: '+R1.name); return L; }
function closeSegPop(){ const p=document.getElementById('segpop'); if(p) p.remove(); }
function openSegPop(el){ closeSegPop(); const P=A.P||phaseAt(now()); const day=P.day||computeDay(now()); const x=day[+el.dataset.seg]; if(!x) return; A.segX=x;
  const L=segInfo(x), m=document.createElement('div'); m.id='segpop'; m.className='segpop'; m.setAttribute('role','dialog');
  m.innerHTML='<small>'+fmtClock(x.st)+' – '+fmtClock(x.en)+'</small><b>'+esc(x.b.name)+'</b>'+(L.length?'<ul>'+L.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>':'<span class="hint">Nothing planned yet.</span>')+'<div class="row">'+(x.b.startR&&routineById(x.b.startR)?'<button class="btn gold sm" type="button" data-run="'+x.b.startR+'" data-sprun="1">Run '+esc(routineById(x.b.startR).name)+' now</button>':'')+'<button class="btn sm" type="button" data-sp="show">Show on the board</button><button class="btn alt sm" type="button" data-sp="edit">Edit</button></div>';
  document.body.appendChild(m); const r=el.getBoundingClientRect(); const side=document.body.classList.contains('tl-side');
  if(side){ m.style.left=(r.right+12)+'px'; m.style.top=Math.max(8,Math.min(r.top,innerHeight-m.offsetHeight-8))+'px'; } else { m.style.left=Math.max(8,Math.min(r.left,innerWidth-m.offsetWidth-8))+'px'; m.style.top=(r.bottom+8)+'px'; } }

const DESK={single:{n:1,c:1,w:9,h:9},pair:{n:2,c:2,w:16,h:9},group4:{n:4,c:2,w:16,h:17},group6:{n:6,c:3,w:22,h:17}};
const SEAT_LAYOUTS=[['pairs','Rows of pairs'],['group4','Groups of 4'],['group6','Groups of 6'],['ushape','U shape'],['rows','Single desks in rows']];
function seatPlan(){ if(!S.seat||!S.seat.tables) { S.seat={layout:'pairs',tables:[],seats:{}}; buildLayout('pairs',true); } return S.seat; }
function sid(){ return 't'+Math.random().toString(36).slice(2,8); }
function buildLayout(kind,fill){ const n=Math.max(1,names().length), T=[];
  const grid=(type,cols,need)=>{ const d=DESK[type], rows=Math.ceil(need/cols); for(let r=0;r<rows;r++) for(let c=0;c<cols&&T.length<need;c++) T.push({id:sid(),type,x:(100/cols)*(c+.5),y:12+((84)/Math.max(rows,1))*(r+.5)}); };
  if(kind==='pairs') grid('pair',4,Math.ceil(n/2));
  else if(kind==='group4') grid('group4',4,Math.ceil(n/4));
  else if(kind==='group6') grid('group6',3,Math.ceil(n/6));
  else if(kind==='rows') grid('single',7,n);
  else if(kind==='ushape'){ let left=n; const side=Math.min(3,Math.ceil(n/8)); for(let i=0;i<side;i++){ T.push({id:sid(),type:'pair',x:7,y:22+i*26,v:true}); T.push({id:sid(),type:'pair',x:93,y:22+i*26,v:true}); } left-=side*4;
    const back=Math.max(0,Math.min(4,Math.ceil(left/2))); for(let i=0;i<back;i++) T.push({id:sid(),type:'pair',x:23+i*(54/Math.max(back-1,1)),y:89}); left-=back*2;
    const mid=Math.max(0,Math.ceil(left/2)); for(let i=0;i<mid;i++) T.push({id:sid(),type:'pair',x:26+(i%3)*24,y:42+Math.floor(i/3)*20}); }
  S.seat={layout:kind,tables:T,seats:{}}; if(fill) fillSeats(false); save(); }
function allSeats(){ const P=seatPlan(), out=[]; P.tables.forEach(t=>{ for(let i=0;i<DESK[t.type].n;i++) out.push([t.id,i]); }); return out; }
function fillSeats(shuffle){ const P=S.seat, L=names().slice(); if(shuffle) L.sort(()=>Math.random()-.5); P.seats={}; allSeats().forEach(([t,i])=>{ (P.seats[t]=P.seats[t]||[])[i]=L.shift()||''; }); save(); }
function seatedNames(){ const P=seatPlan(); return Object.values(P.seats).flat().filter(Boolean); }
function renderSeats(full){ if(!full) return; const P=seatPlan(), ed=!!A.seatEdit, sel=A.seatSel;
  const unseated=names().filter(n=>!seatedNames().includes(n));
  const desk=t=>{ const d=DESK[t.type], ss=(P.seats[t.id]||[]); return '<div class="desk d-'+t.type+(ed?' ed':'')+'" data-desk="'+t.id+'" style="left:'+t.x+'%;top:'+t.y+'%;width:'+(t.v?9:d.w)+'%;--c:'+(t.v?1:d.c)+';'+(t.rot?'--rot:'+t.rot+'deg;':'')+'">'+Array.from({length:d.n},(_,i)=>{ const nm=ss[i]||''; const on=sel&&sel.t===t.id&&sel.i===i; return '<button type="button" class="seat'+(nm?'':' empty')+(on?' sel':'')+'" data-seat="'+t.id+':'+i+'">'+(nm?esc(nm):(ed?'+':''))+'</button>'; }).join('')+(ed?'<button type="button" class="deskx" data-deskdel="'+t.id+'" aria-label="Remove table">✕</button><span class="deskrot"><button type="button" data-deskrot="'+t.id+':-15" aria-label="Turn left" title="Turn left">↺</button><button type="button" data-deskrot="'+t.id+':15" aria-label="Turn right" title="Turn right">↻</button></span>':'')+'</div>'; };
  const tools=ed?'<div class="row seattools"><label class="hint">Layout <select id="seatLayout">'+SEAT_LAYOUTS.map(([k,l])=>opt(k,l,P.layout)).join('')+'</select></label><button class="btn alt sm" type="button" data-st="add:pair">+ Pair</button><button class="btn alt sm" type="button" data-st="add:group4">+ Group of 4</button><button class="btn alt sm" type="button" data-st="add:group6">+ Group of 6</button><button class="btn alt sm" type="button" data-st="add:single">+ Single</button><button class="btn gold sm" type="button" data-st="shuffle">Shuffle seats</button><button class="btn sm" type="button" data-st="done">Done editing</button></div><p class="hint" style="margin:0">Drag tables to match your room, and use ↺ ↻ to angle them. Tap a name, then another seat, to swap. '+(unseated.length?'Not seated yet: '+unseated.map(n=>'<button type="button" class="chip uns'+(sel&&sel.n===n?' sel':'')+'" data-uns="'+esc(n)+'">'+esc(n)+'</button>').join(' '):'Everyone has a seat.')+'</p>':'';
  setStage('one','<section class="card seatcard"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">Seating plan</div><h1 class="mid" style="color:var(--gum-d)">Find your seat</h1></div><div class="row">'+(ed?'':'<button class="btn alt sm" type="button" data-st="edit">Edit seats</button>')+backBtn('Close')+'</div></div>'+tools+'<div class="seatroom" id="room"><div class="board">Front of the room</div>'+P.tables.map(desk).join('')+'</div></section>'); }

function nluRun(raw){ const s=nNorm(raw); if(!s.trim()) return {ok:false,empty:true};
  const nameHit=it=>{ if(!it.names||(it.nameNeed&&!it.nameNeed.test(s))) return 0; let L=[]; try{ L=it.names()||[]; }catch(_){ } return L.some(n=>{ const t=nNorm(n).trim(); return t.length>2&&s.includes(' '+t+' '); })?(it.nameW||4):0; };
  const scored=INTENTS.map(it=>({it,sc:it.k.reduce((a,[re,w])=>a+(re.test(s)?w:0),0)+nameHit(it)})).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc);
  for(const {it,sc} of scored){ if(sc<1.2) break; let r; try{ r=it.run(s); }catch(e){ r='Oops, I couldn’t do that.'; } if(r==='skip') continue; if(r) Bird.say(r); if(!/^(another|next|prev|pause|resume|home|whatnext|when|timeleft|clock|points\?|whojob|help)$/.test(it.id)){ V.lastIntent=it.id; V.lastText=s; } return {ok:true,id:it.id}; }
  return {ok:false,guesses:scored.slice(0,3).map(x=>x.it.id)}; }

function vHandle(cmd){ cmd=(cmd||'').replace(/\s+/g,' ').trim(); V.last=cmd.toLowerCase(); V.awake=0; vMark();

  const G={brain:'Brain break',timer:'Timer',pick:'Pick a name',groups:'Groups',exit:'Exit ticket',entry:'Entry ticket',think:'Thinking routine',reflect:'Reflection',checkin:'Check-in',quiz:'Quiz game',poll:'Poll',packup:'Pack up',routine:'Routines',seats:'Seating plan',jobs:'Helpers',attention:'Attention',reset:'Reset the room',music:'Music',home:'Home',point:'+1 point'};
  const opts=(r.guesses||[]).filter(g=>G[g]); const base=['brain','timer','pick','exit']; const list=(opts.length?opts:base).slice(0,3);

function mStats(r,from,to){ const tr=r.trace||'', a=Math.max(0,Math.floor((from||0)*2)), b=Math.min(tr.length,to!=null?Math.ceil(to*2):tr.length), seg=tr.slice(a,b);
  let t=0,s=0,q=0,run=0,longest=0,gap=0,runStart=0,longestAt=null; for(let i=0;i<seg.length;i++){ const c=seg[i]; if(c==='t'){ if(!run) runStart=i; t++; run+=1+gap; gap=0; if(run>longest){ longest=run; longestAt=(a+runStart)/2; } } else { if(c==='s'){ s++; } else q++; if(run){ gap++; if(gap>5){ run=0; gap=0; } } } }
  const n=Math.max(1,seg.length), voice=Math.max(1,t+s), qs=(r.qs||[]).filter(x=>x.at>=a/2&&x.at<=b/2), wq=qs.filter(x=>x.wait!=null), mins=seg.length/120;
  const ev=(r.ev||[]).filter(x=>x.at>=a/2&&x.at<=b/2), praise=ev.filter(x=>x.k==='p'||x.k==='ps').length, specN=ev.filter(x=>x.k==='ps').length, cs=ev.filter(x=>x.k==='c'), corr=cs.length, louds=ev.filter(x=>x.k==='loud'), atts=ev.filter(x=>x.k==='att');
  const settles=atts.map(x=>{ const i0=Math.floor(x.at*2); for(let j=i0+1;j<Math.min(tr.length-3,i0+60);j++){ const w=tr.slice(j,j+4); if(!w.includes('s')&&(w.match(/q/g)||[]).length>=2) return (j-i0)/2; } return 30; });

function mMet(id,v){ const M2=MET[id]; if(v==null) return null; return M2.better==='up'?v>=M2.target:v<=M2.target; }

    straight+=' '+also.concat(slip).join(' '); tip=MET[key].tip; ask=MET[key].ask; }

    ask='What did you do differently in this lesson, and what would make it stick?'; }

  return {work,straight,tip,ask,why:MET[key].why,refs:MET[key].refs.slice(),key}; }

   (r.goal&&typeof aiActive==='function'&&aiActive(r)?'<details class="mall"><summary>Roomie’s measures and feedback for this lesson</summary>'+goalReportHTML(r)+'</details>':goalReportHTML(r))+aiBoxHTML(r)+(r.goal?'<div class="mgoalfoot"><label class="thin"><span>Your reflection <em>(only on this computer, shows on your progress page)</em></span><textarea id="mirNote" rows="2" placeholder="What did you notice? What will you try next time?">'+esc(r.note||'')+'</textarea></label><details class="mall"><summary>Your questions ('+r.qs.length+')</summary><div class="mqs">'+r.qs.slice(0,40).map(q=>'<div class="mq"><span class="'+(q.open?'o':'c')+'">'+(q.open?'open':'closed')+'</span><p>'+esc(q.text)+'</p><b>'+(q.wait==null?'':q.wait.toFixed(1)+'s')+'</b></div>').join('')+'</div></details></div>':'<div class="mgrid"><div class="mstep"><small>One thing to try</small><b>'+esc(st[0])+'</b><p>'+esc(st[1])+'</p><p class="mtry">'+esc(st[2])+'</p><label class="thin"><span>Your reflection <em>(only on this computer)</em></span><textarea id="mirNote" rows="2" placeholder="What did you notice? What will you try?">'+esc(r.note||'')+'</textarea></label></div>'+
   '<div class="mqs"><small>Your questions</small>'+(r.qs.length?r.qs.slice(0,40).map(q=>'<div class="mq"><span class="'+(q.open?'o':'c')+'">'+(q.open?'open':'closed')+'</span><p>'+esc(q.text)+'</p><b>'+(q.wait==null?'':q.wait.toFixed(1)+'s')+'</b></div>').join(''):'<p class="hint">Roomie didn’t catch any questions. Try wearing a microphone, or check the listening box in Setup → Coach.</p>')+'</div></div>')+
   '<p class="hint" style="margin:0">These are estimates from sound levels and Roomie’s on-computer listening'+(r.worn?' with your worn microphone':', using the laptop microphone only (wear a microphone for better accuracy)')+'. No audio was kept or sent anywhere.'+((S.coach||{}).ai&&AI_LIVE?' Your words are only sent to the AI coach if you choose to send them.':'')+'</p></section>'); }
document.addEventListener('input',e=>{ if(e.target.id==='mirNote'){ const r=(S.mirrors||[]).find(x=>x.id===A.mirId)||(S.mirrors||[])[0]; if(r){ r.note=e.target.value; save(); } } });
/* Setup → Coach tab */
async function coachTabHTML(){ return ''; }
function coachTab(){ const C=S.coach||{};
  if(!C.unlocked) return '<div class="okbox" style="font-size:16px;line-height:1.6"><b>Lesson mirror (early access)</b><br>Roomie listens to a lesson on this computer and shows you, privately, how much you talked, how much students talked, your questions and your wait time. No audio is kept or sent anywhere.</div><div class="row"><input id="coachCode" type="text" placeholder="Early access code" style="max-width:240px"><button class="btn" type="button" data-cx="unlock">Unlock</button></div>';
  const M2=(S.mirrors||[]);
  return goalTabHTML()+'<div class="row" style="justify-content:space-between;align-items:center"><div><h2 style="margin:0">Lesson mirror</h2><p class="hint" style="margin:0">Early access. Measured on this computer. No audio is kept or sent.</p></div>'+(M.on?'<button class="btn" type="button" data-cx="stop">Stop and see my mirror</button>':'<button class="btn gold" type="button" data-cx="start">Start listening to this lesson</button>')+'</div>'+
   '<div class="cmics"><label class="thin"><span>Room microphone</span><select id="micRoom"><option value="">Laptop / default microphone</option></select></label><label class="thin"><span>Your worn microphone <em>(optional, much more accurate)</em></span><select id="micWorn"><option value="">None</option></select></label><div class="row"><button class="btn alt sm" type="button" data-cx="cal">Set my teaching voice</button><span class="hint">'+(C.tLevel?'Voice set ✓':'Do this once: Roomie listens to you say a sentence in your normal teaching voice.')+'</span></div></div>'+
   aiSettingsHTML()+'<p class="hint" style="margin:0">You can also say “Hey Roomie, mirror this lesson” and “Hey Roomie, stop the mirror”.</p>'+
   '<h3 style="margin:6px 0 0">Past lessons</h3>'+(M2.length?'<div class="mhist">'+M2.map(r=>'<div class="mhrow"><button type="button" class="mh" data-cx="open:'+r.id+'"><b>'+esc(r.block||'Lesson')+'</b><span>'+new Date(r.date).toLocaleDateString('en-AU',{day:'numeric',month:'short'})+' · '+r.mins+' min · you '+Math.round(r.teacher*100)+'% · wait '+(r.wait==null?'–':r.wait.toFixed(1)+'s')+(r.goal?' · focus attempt':'')+'</span></button><button type="button" class="mhdel" data-cx="del:'+r.id+'" aria-label="Delete this lesson">Delete</button></div>').join('')+'</div>':'<p class="hint">No lessons yet.</p>')+(M2.length?'<button class="btn alt sm" type="button" data-cx="clear">Delete all mirrors</button>':''); }
async function coachFillMics(){ const L=await mirDevices(); const C=S.coach||{}; [['micRoom',C.room],['micWorn',C.worn]].forEach(([id,v])=>{ const s=document.getElementById(id); if(!s) return; L.forEach((d,i)=>{ const o=document.createElement('option'); o.value=d.deviceId; o.textContent=d.label||('Microphone '+(i+1)); if(d.deviceId===v) o.selected=true; s.appendChild(o); }); }); }
document.addEventListener('change',e=>{ const id=e.target.id; if(id==='micRoom'||id==='micWorn'){ S.coach=Object.assign(S.coach||{},{[id==='micRoom'?'room':'worn']:e.target.value}); save(); } });
document.addEventListener('click',async e=>{ const b=e.target.closest('[data-cx]'); if(!b) return; audio(); const [a,v]=b.dataset.cx.split(':');
  if(a==='unlock'){ const c=(document.getElementById('coachCode').value||'').trim().toLowerCase(); if(c!==MIR_CODE){ toast('That code isn’t right.'); return; } S.coach=Object.assign(S.coach||{},{unlocked:true}); save(); try{ const s=await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(t=>t.stop()); }catch(_){ } renderSetup(); }
  if(a==='cal'){ b.disabled=true; b.textContent='Say: “Good morning everyone, let’s get started.”'; try{ await mirCalibrate(); toast('Got it. Your teaching voice is set.'); }catch(_){ toast('Couldn’t use the microphone.'); } renderSetup(); }
  if(a==='start'){ closeSetup(); await mirStart(); }
  if(a==='stop'){ mirStop(); A.mirId=null; closeSetup(); openOverlay('mirror'); }
  if(a==='open'){ A.mirId=v; closeSetup(); openOverlay('mirror'); }
  if(a==='del'){ if(!b.dataset.sure){ b.dataset.sure='1'; b.textContent='Tap again to delete'; b.classList.add('sure'); setTimeout(()=>{ if(b.isConnected){ delete b.dataset.sure; b.textContent=b.dataset.lbl||'Delete'; b.classList.remove('sure'); } },4000); return; }
    S.mirrors=(S.mirrors||[]).filter(x=>x.id!==v); ((S.coach||{}).goals||[]).forEach(g=>{ g.attempts=(g.attempts||[]).filter(x=>x!==v); }); save(); toast('Lesson deleted.');
    if(A.overlay==='mirror'){ A.mirId=null; goHome(); } else renderSetup(); }
  if(a==='clear'){ if(b.dataset.sure){ S.mirrors=[]; save(); renderSetup(); } else { b.dataset.sure='1'; b.textContent='Tap again to delete them all'; } } });

/* ---- v1.1: welcome tour ---- */
function tourSteps(){ const tools=S.mode==='tools';
  const s=[
   {t:'Hi, I’m Roomie!',b:'I run the routines, timers and fun bits on your board, so you can teach. This quick tour shows you where everything is. It takes about a minute.'},
   {sel:'#classBtn',t:'Your class',b:'Tap your class name for the seating plan, pick a name, groups, rotations, Mystery Hero and your class list.'}];
  if(tools) s.push({sel:'#stage .card',t:'Your toolkit',b:'Everything is a big button here. Tap one to start it, and tap Back or Done to come home again. Nothing changes by itself in toolkit mode.'});
  else s.push(
   {sel:'#strip',t:'Today',b:'Your day, down the side. Roomie changes over by itself when each block starts. Tap any subject to see what’s planned, run its routine or edit it.'},
   {sel:'#stage .card',t:'The main screen',b:'This is what the class sees: the routine, what to get out, expectations and the countdown. It updates by itself all day.'});
  s.push(
   {sel:'#stage .feel, #stage .side',t:'Feelings check-in',b:'Students tap how they feel on their way in. It only counts, never names. Tap Teacher view to see the numbers.'},
   tools?{sel:'.dacts',t:'Always here',b:'Give a class point, calm the room with Reset, or get everyone’s eyes on you with Attention.'}
        :{sel:'.dtools',t:'Your tools',b:'Brain breaks, tickets, thinking routines, quiz games, pack up and more. Use them any time, planned or not.'},
   ...(tools?[]:[{sel:'.dacts',t:'Always here',b:'Give a class point, calm the room with Reset, or get everyone’s eyes on you with Attention.'}]),
   {sel:'.top [data-tool="float"]',t:'Float over your slides',b:'Teaching from slides or a video? Tap this and I’ll float in a small window on top, with the countdown. Drag me anywhere.'},
   {sel:'#lookBtn',t:'Look & colours',b:'Change colours, my colour, and where your timetable sits.'},
   {sel:'#setupBtn',t:'Setup',b:'Add your class list, plan your day, set your routines and choose whole-day or toolkit mode. Try the Demo clock to watch a whole day in minutes.'},
   {t:'You’re ready!',b:'Start by adding your class list in Setup. You can take this tour again any time from the ? button at the top.',end:true});
  return s; }
let TOUR=null;
function startTour(){ closeDMenu&&closeDMenu(); if(typeof closeClassPop==='function') closeClassPop(); if(typeof closeSegPop==='function') closeSegPop(); TOUR={i:0,steps:tourSteps()}; drawTour(); }
function endTour(){ TOUR=null; const r=document.getElementById('tour'); if(r) r.remove(); S.toured=true; save(); }
function drawTour(){ let r=document.getElementById('tour'); if(!r){ r=document.createElement('div'); r.id='tour'; r.setAttribute('role','dialog'); r.setAttribute('aria-modal','true'); document.body.appendChild(r); }
  const st=TOUR.steps[TOUR.i]; let el=null; if(st.sel) for(const q of st.sel.split(',')){ const e=document.querySelector(q.trim()); if(e&&e.offsetParent!==null){ el=e; break; } }
  const n=TOUR.steps.length, last=TOUR.i===n-1;
  r.innerHTML='<div class="tourhole'+(el?'':' none')+'"></div><div class="tourcard"><div class="tourbird">'+birdSVG()+'</div><div class="tourtxt"><small>'+(TOUR.i+1)+' of '+n+'</small><b>'+esc(st.t)+'</b><p>'+esc(st.b)+'</p><div class="tourdots">'+TOUR.steps.map((_,k)=>'<i class="'+(k===TOUR.i?'on':'')+'"></i>').join('')+'</div><div class="row"><button class="btn alt sm" type="button" data-tour="skip">'+(last?'Close':'Skip tour')+'</button>'+(TOUR.i>0?'<button class="btn alt sm" type="button" data-tour="back">Back</button>':'')+'<button class="btn sm" type="button" data-tour="'+(last?'setup':'next')+'">'+(last?'Add my class':TOUR.i===0?'Show me around':'Next')+'</button></div></div></div>';
  const hole=r.querySelector('.tourhole'), card=r.querySelector('.tourcard');
  if(el){ const b=el.getBoundingClientRect(), p=8; Object.assign(hole.style,{left:(b.left-p)+'px',top:(b.top-p)+'px',width:(b.width+p*2)+'px',height:(b.height+p*2)+'px'});
    const cw=card.offsetWidth, ch=card.offsetHeight, W=innerWidth, H=innerHeight; let x, y;
    if(b.right+16+cw<W) { x=b.right+18; y=b.top; } else if(b.left-18-cw>0){ x=b.left-18-cw; y=b.top; } else if(b.bottom+16+ch<H){ x=b.left; y=b.bottom+18; } else { x=b.left; y=b.top-18-ch; }
    card.style.left=Math.max(12,Math.min(x,W-cw-12))+'px'; card.style.top=Math.max(12,Math.min(y,H-ch-12))+'px'; }
  else { card.classList.add('center'); }
  const f=card.querySelector('[data-tour="next"],[data-tour="setup"]'); if(f) f.focus(); }
document.addEventListener('click',e=>{ const t=e.target.closest('[data-tour]'); if(!t) return; audio(); const a=t.dataset.tour;
  if(a==='start'){ startTour(); return; }
  if(!TOUR) return;
  if(a==='next'){ TOUR.i++; pop(); drawTour(); }
  if(a==='back'){ TOUR.i--; drawTour(); }
  if(a==='skip') endTour();
  if(a==='setup'){ endTour(); tab='class'; openSetup(); } });
document.addEventListener('keydown',e=>{ if(!TOUR) return; if(e.key==='Escape') endTour(); if(e.key==='ArrowRight'&&TOUR.i<TOUR.steps.length-1){ TOUR.i++; drawTour(); } if(e.key==='ArrowLeft'&&TOUR.i>0){ TOUR.i--; drawTour(); } });
addEventListener('resize',()=>{ if(TOUR) setTimeout(drawTour,80); });
/* first time: start the tour after the board appears */
document.getElementById('startBtn').addEventListener('click',()=>{ if(!S.toured) setTimeout(()=>{ if(!TOUR) startTour(); },1200); });
