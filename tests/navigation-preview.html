<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Roomie navigation size checks</title><style>body{margin:16px;font:16px system-ui;background:#eef3ef;color:#16302a}button{padding:10px;margin:4px}iframe{display:block;width:390px;max-width:100%;height:740px;border:2px solid #4a6256;background:white}</style><h1>Navigation size checks</h1><p>Local manual QA. These controls resize the actual app frame. Use fictional classroom data.</p><button data-width="390">Phone · 390px</button><button data-width="768">Tablet · 768px</button><button data-width="1280">Desktop · 1280px</button><iframe title="Roomie preview" src="../app/"></iframe><script>document.addEventListener('click',e=>{if(e.target.dataset.width)document.querySelector('iframe').style.width=e.target.dataset.width+'px';});</script></html>
